<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Desk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Trade Desk</title>
<style>
/* Layout idea: a phone-first fantasy app. Black chrome, charcoal cards, one blue accent, team-color badges carry identity. Single dark theme by choice. */
:root {
  --bg: #23272f; --surface: #2e333d; --surface2: #393f4b; --ink: #f2f4f7; --muted: #aab2be; --line: #434a57;
  --accent: #3d8bff; --accent-ink: #ffffff; --accent-soft: rgba(61, 139, 255, .16); --chrome: #191c22; --chrome-ink: #ffffff;
  --good: #34c76f; --good-soft: rgba(52, 199, 111, .15); --mid: #f2b705; --mid-soft: rgba(242, 183, 5, .15); --bad: #ff5a5f; --bad-soft: rgba(255, 90, 95, .15);
  --qb: #d6457f; --rb: #1fb37a; --wr: #3d8bff; --te: #f08a24; --pick: #8b93a1;
  --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mt { margin-top: 16px; }
.lead { max-width: 70ch; margin: 0 0 14px; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- chrome ---- */
.top { background: var(--chrome); color: var(--chrome-ink); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #2b3039; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mark { font: 900 15px var(--display); background: var(--accent); color: #fff; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; flex: none; letter-spacing: -.02em; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.sub { font-size: 12px; color: #8d939c; }
.leagues { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ltab { background: #262a32; color: #e6e8eb; border: 1px solid #3a404b; border-radius: 999px; padding: 5px 12px; cursor: pointer; text-decoration: none; display: flex; gap: 6px; align-items: baseline; font-weight: 700; font-size: 13px; }
.ltab small { font-weight: 600; font-size: 10px; color: #8d939c; text-transform: uppercase; letter-spacing: .06em; }
.ltab.on { background: #fff; color: #000; border-color: #fff; }
.ltab.on small { color: #555; }
.syncb { gap: 6px; align-items: center; }
.syncb .spin { display: inline-block; font-size: 15px; line-height: 1; }
.syncb.busy .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ltab.add { border-style: dashed; color: #b8bec6; background: transparent; }
.tabs { background: var(--chrome); display: flex; gap: 2px; padding: 0 20px; overflow-x: auto; border-bottom: 1px solid #2b3039; }
.tabs a { color: #aeb5bf; text-decoration: none; padding: 11px 13px; font: 700 13px var(--display); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tabs a svg { width: 18px; height: 18px; flex: none; }
.tabs a.on { color: #fff; border-bottom-color: var(--accent); }
.tabs a:hover { color: #fff; }
main { padding: 20px; max-width: 1180px; margin: 0 auto; }
#banner { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid rgba(61,139,255,.45); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.head-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
select, input[type=search], textarea, input[type=number] { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: 100%; color: var(--ink); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.ghost.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile-k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tile-v { font: 800 20px var(--display); letter-spacing: -.01em; }
.tile-s { font-size: 12px; color: var(--muted); }

/* ---- identity: avatars, team badges, position chips ---- */
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 800 13px var(--display); color: #fff; flex: none; box-shadow: inset 0 0 0 2px var(--ring, rgba(255,255,255,.25)); letter-spacing: -.02em; }
.av.lg { width: 64px; height: 64px; font-size: 22px; box-shadow: inset 0 0 0 3px var(--ring, rgba(255,255,255,.25)); }
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.av.pick { background: #4a5160; color: #cfd4da; border-radius: 10px; }
.tb { display: inline-block; font: 800 10px var(--display); padding: 2px 6px; border-radius: 5px; color: #fff; letter-spacing: .03em; border-left: 3px solid var(--ring, transparent); }
.pos { display: inline-block; min-width: 30px; text-align: center; font: 800 10px var(--display); padding: 2px 5px; border-radius: 5px; color: #fff; background: var(--pick); letter-spacing: .03em; }
.pos-QB { background: var(--qb); } .pos-RB { background: var(--rb); } .pos-WR { background: var(--wr); } .pos-TE { background: var(--te); }
.pos-K, .pos-DST { background: #5b6270; }
.rank { display: inline-block; font: 800 12px var(--display); padding: 2px 8px; border-radius: 999px; min-width: 38px; text-align: center; }
.rank.good, .fair.good { background: var(--good-soft); color: var(--good); }
.rank.mid, .fair.mid { background: var(--mid-soft); color: var(--mid); }
.rank.bad { background: var(--bad-soft); color: var(--bad); }
.trend { font-size: 12px; font-weight: 700; }
.trend.up { color: var(--good); } .trend.down { color: var(--bad); }
.inj { font-size: 10px; font-weight: 800; color: #fff; background: var(--bad); padding: 1px 5px; border-radius: 4px; text-transform: uppercase; }
.age { font-size: 12px; }
.estb { font-size: 11px; font-weight: 700; color: var(--mid); background: var(--mid-soft); padding: 0 6px; border-radius: 999px; cursor: help; }
.modal-card.wide { max-width: 560px; }
.search-sheet { min-height: 60vh; }
.gres { margin-top: 10px; display: flex; flex-direction: column; }
.gr { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 2px; text-align: left; cursor: pointer; }
.gr:hover { background: var(--accent-soft); }
.gr .pl { pointer-events: none; }
.gr-r { display: flex; gap: 8px; align-items: center; flex: none; }
.ltab.gs { align-items: center; }
.prospect { cursor: pointer; }
.prospect:hover { border-color: var(--accent); }
.boards td { padding: 7px 4px; }
.newsb { font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); padding: 0 6px; border-radius: 999px; cursor: help; }
.newsbox { background: var(--accent-soft); border: 1px solid rgba(61,139,255,.4); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.newsbox p { margin: 4px 0; font-size: 14px; }
.estb.man { color: var(--accent); background: var(--accent-soft); }

/* player line */
.pl { display: flex; gap: 10px; align-items: center; min-width: 0; cursor: pointer; border-radius: 10px; }
.pl:hover .pl-name { color: var(--accent); }
.pl-text { min-width: 0; }
.pl-main { display: flex; gap: 6px; align-items: center; min-width: 0; }
.pl-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.pl-meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; align-items: center; margin-top: 2px; }
.vbtn { font: inherit; font-weight: 700; background: none; border: 1px dashed transparent; border-radius: 8px; padding: 2px 6px; cursor: pointer; color: var(--ink); }
.vbtn:hover, .vbtn:focus-visible { border-color: var(--accent); }

/* bars */
.pbar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 60px; gap: 10px; align-items: center; margin: 12px 0; }
.pbar-l { display: flex; gap: 6px; align-items: center; }
.pbar-track { position: relative; height: 10px; background: var(--surface2); border-radius: 5px; }
.pbar-fill { height: 100%; border-radius: 5px; background: var(--mid); }
.pbar-fill.good { background: var(--good); } .pbar-fill.bad { background: var(--bad); }
.pbar-avg { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; opacity: .7; border-radius: 1px; }
.pbar-v { font-weight: 700; text-align: right; font-size: 13px; }

table { border-collapse: collapse; width: 100%; }
.roster td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.roster tr:last-child td { border-bottom: 0; }
.roster tr.me td, .league tr.me td { background: var(--accent-soft); }
.slot { width: 52px; font: 800 11px var(--display); color: var(--muted); text-transform: uppercase; }

/* trade ideas */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.idea-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.idea-team { font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.fair { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.idea-sides { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
.idea-sides .pl { margin-bottom: 8px; }
.side-k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; display: block; }
.side-v { font-weight: 700; color: var(--muted); font-size: 13px; }
.arrow { align-self: center; font-size: 18px; color: var(--accent); }
.impact { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 700; font-size: 13px; }
.impact.big { font-size: 14px; margin-top: 10px; }
.pos-d { color: var(--good); } .neg-d { color: var(--bad); }
.why { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.why li { margin: 3px 0; }
.idea .btn { align-self: flex-start; margin-top: auto; }
.row-pl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row-pl > .small { grid-column: 1 / -1; padding-left: 46px; }

/* calculator */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.side { display: flex; flex-direction: column; gap: 10px; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.side-head h3 { margin: 0; }
.assets { display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
.asset { display: grid; grid-template-columns: minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; padding: 8px; background: var(--surface2); border-radius: 12px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.x:hover { color: var(--bad); }
.empty { padding: 18px 0; text-align: center; }
.search { position: relative; }
.search input { width: 100%; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 30; overflow: hidden; }
.results:empty { display: none; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; width: 100%; padding: 9px 10px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.res:hover, .res:focus { background: var(--accent-soft); }
.pad { padding: 10px; }
.side-total { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
.verdict { border-left: 4px solid var(--line); }
.verdict.good { border-left-color: var(--good); } .verdict.mid { border-left-color: var(--mid); } .verdict.bad { border-left-color: var(--bad); }
.v-head { font: 800 19px var(--display); display: flex; flex-direction: column; margin-bottom: 10px; }
.v-head small { font: 400 13px var(--body); color: var(--muted); }
.split { display: flex; height: 30px; border-radius: 999px; overflow: hidden; font-weight: 800; font-size: 13px; }
.split-a { background: var(--accent); color: #fff; display: flex; align-items: center; padding: 0 12px; min-width: 64px; }
.split-b { flex: 1; background: #4a5160; color: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; min-width: 64px; }
.even { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: 13px; font-weight: 700; }
.chip.on { background: #fff; color: #000; border-color: #fff; }
.v-actions { display: flex; gap: 8px; margin-top: 12px; }
.offer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; margin-top: 8px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.offer:hover { border-color: var(--accent); }
.target { margin-bottom: 12px; padding: 12px 16px; }
.target-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.target-row + .target-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tlabel { min-width: 120px; }
.grow { flex: 1; min-width: 200px; }
.tchip { display: inline-flex; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 6px 4px 6px; font-weight: 700; }

/* league tables */
.tablewrap { overflow-x: auto; }
.card.tablewrap { padding: 0; }
.league th, .league td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.league th { font: 800 11px var(--display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.league .num { text-align: right; }
.league .c { text-align: center; }
.league tr.cut td { border-bottom: 2px dashed var(--accent); }
.mu-lines .pl-name { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcell { display: flex; gap: 10px; align-items: center; }
.odds { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.odds-bar { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.odds-bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }

/* weekly */
.mu { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.mu-team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.mu-name { font-weight: 800; overflow-wrap: anywhere; }
.mu-pts { font: 900 26px var(--display); letter-spacing: -.02em; }
.mu-vs { font-weight: 800; color: var(--muted); }
.wp { height: 10px; border-radius: 5px; background: #4a5160; overflow: hidden; margin: 12px 0 4px; }
.wp i { display: block; height: 100%; background: var(--accent); }
.mu-lines { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 0 8px; margin-top: 12px; font-size: 13px; }
.mu-lines > div { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; min-width: 0; }
.mu-lines .r { justify-content: flex-end; text-align: right; }
.mu-lines .s { justify-content: center; color: var(--muted); font: 800 10px var(--display); }
.ss-head { display: flex; gap: 24px; margin-bottom: 10px; }
.grid-io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.opp { display: inline-block; min-width: 44px; font: 800 12px var(--display); padding: 4px 6px; border-radius: 6px; text-align: center; }
.opp.easy { background: var(--good-soft); color: var(--good); }
.opp.mid { background: var(--surface2); color: var(--ink); }
.opp.hard { background: var(--bad-soft); color: var(--bad); }
.opp.bye { background: #fff; color: #000; }
.sched td { padding: 6px 4px; }
.partners ol { margin: 6px 0 12px; padding-left: 20px; font-size: 14px; }
.partners li { margin: 5px 0; }

/* sync */
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 56px; position: relative; }
.steps li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 800 14px var(--display); display: grid; place-items: center; }
.steps h3 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 16px; margin-bottom: 4px; }
.steps p { margin: 4px 0 8px; max-width: 70ch; }
.bm { display: inline-block; background: #fff; color: #000; text-decoration: none; padding: 9px 16px; border-radius: 999px; font-weight: 800; border: 2px dashed var(--accent); cursor: grab; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; }
.lrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow label { display: flex; gap: 6px; align-items: center; }
.good-t { color: var(--good); } .bad-t { color: var(--bad); }

/* scouting */
.prospects { display: flex; flex-direction: column; gap: 8px; }
.tierh { font: 800 12px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-top: 12px; }
.prospect { display: grid; grid-template-columns: 40px minmax(0, 1fr) 92px; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.prospect.me { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--surface); }
.pr-rank { font: 900 18px var(--display); color: var(--muted); display: flex; flex-direction: column; align-items: center; }
.pr-rank small { font-size: 11px; font-weight: 800; }
.agechip { font-weight: 700; color: var(--ink); }
.agechip.young { color: var(--good); }
.agechip.old { color: var(--mid); }
.pr-stats { font-weight: 700; font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
.pr-note { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 72ch; }
.pr-pick { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pk { font: 800 13px var(--display); padding: 3px 9px; border-radius: 8px; background: var(--surface2); }
.pk.mine { background: var(--accent); color: #fff; }
.mv { display: flex; gap: 4px; margin-top: 4px; }
.mvb { width: 36px; height: 32px; border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; cursor: pointer; color: var(--ink); }
.mvb:hover { border-color: var(--accent); }

/* modal + player sheet */

}

<script>
/* ---------- Core logic: values, lineups, team analysis, trades (no DOM) ---------- */
const POS = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'D/ST' };
const PRO = { 0: 'FA', 1: 'ATL', 2: 'BUF', 3: 'CHI', 4: 'CIN', 5: 'CLE', 6: 'DAL', 7: 'DEN', 8: 'DET', 9: 'GB', 10: 'TEN', 11: 'IND', 12: 'KC', 13: 'LV', 14: 'LAR', 15: 'MIA', 16: 'MIN', 17: 'NE', 18: 'NO', 19: 'NYG', 20: 'NYJ', 21: 'PHI', 22: 'ARI', 23: 'PIT', 24: 'LAC', 25: 'SF', 26: 'SEA', 27: 'TB', 28: 'WAS', 29: 'CAR', 30: 'JAX', 33: 'BAL', 34: 'HOU' };
const SLOT_NAME = { 0: 'QB', 2: 'RB', 4: 'WR', 6: 'TE', 16: 'D/ST', 17: 'K', 3: 'RB/WR', 5: 'WR/TE', 23: 'FLEX', 7: 'SFLEX', 20: 'Bench', 21: 'IR' };
const SLOT_ELIG = { 0: ['QB'], 2: ['RB'], 4: ['WR'], 6: ['TE'], 16: ['D/ST'], 17: ['K'], 3: ['RB', 'WR'], 5: ['WR', 'TE'], 23: ['RB', 'WR', 'TE'], 7: ['QB', 'RB', 'WR', 'TE'] };
const SLOT_ORDER = [0, 2, 4, 6, 16, 17, 3, 5, 23, 7];
const SKILL = ['QB', 'RB', 'WR', 'TE'];
const TRADE_EXP = 1.15;

const nk = s => String(s || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '').replace(/[^a-z0-9]/g, '');

function parseValues(txt) {
  return String(txt || '').trim().split('\n').filter(Boolean).map(l => {
    const [name, pos, team, espn, value, age, trend] = l.split('|');
    const key = nk(name);
    return {
      id: pos === 'PICK' ? 'k' + key : (espn ? 'e' + espn : 'n' + key + pos),
      name, pos, team: team || '', espn: espn || '', value: +value || 0,
      age: age ? +age : null, trend: +trend || 0, key, fa: true
    };
  });
}

function indexValues(list) {
  const byEspn = new Map(), byKey = new Map(), byId = new Map();
  list.forEach(x => {
    if (x.espn) byEspn.set(x.espn, x);
    byKey.set(x.key + '|' + x.pos, x);
    byId.set(x.id, x);
  });
  return { list, byEspn, byKey, byId };
}

function mkPlayer(r, vs, teamId) {
  const [pid, name, posId, pro, slot, inj, owned, proj, avg] = r;
  const pos = POS[posId] || '?';
  const find = ix => ix ? (ix.byEspn.get(String(pid)) || ix.byKey.get(nk(name) + '|' + pos)) : null;
  const fc = find(vs), alt = fc ? null : find(vs.alt);
  return {
    id: 'e' + pid, espn: String(pid), name, pos,
    team: (fc && fc.team) || (alt && alt.team) || PRO[pro] || 'FA', slot, inj: inj && inj !== 'ACTIVE' ? inj : '',
    value: fc ? fc.value : 0, fcValue: fc ? fc.value : 0, age: (fc || alt || {}).age || null, trend: fc ? fc.trend : 0, owner: teamId,
    altValue: alt ? alt.value : 0, owned: owned != null ? +owned : null, est: fc ? '' : null,
    proTeam: pro, proj: proj != null ? +proj : null, avg: avg != null ? +avg : null
  };
}

/* ---------- Estimated values for players FantasyCalc doesn't value ----------
   1. Value in the other format (dynasty <-> redraft): converted with the ratio seen for the
      10 most similar players (value and age) at the same position, then discounted for injuries in redraft.
   2. No FantasyCalc value at all: matched to valued players with similar ESPN roster % at the position,
      or a small positional floor. Kickers and defenses get a small value from roster % (or a flat floor). */
const SEASON_ENDING = {};
const INJ_FACTOR = { INJURY_RESERVE: 0.3, OUT: 0.6, DOUBTFUL: 0.8, QUESTIONABLE: 0.95, SUSPENSION: 0.5 };
/* Dynasty: injuries matter less (there is next season), age matters more. */
const DYN_INJ_FACTOR = { INJURY_RESERVE: 0.85, OUT: 0.95, SUSPENSION: 0.9 };
const PEAK_AGE = { QB: 31, RB: 25, WR: 27, TE: 28 };
function ageFactor(pos, age) {
  const peak = PEAK_AGE[pos];
  if (!peak || !age) return 1;
  const fall = pos === 'RB' ? 0.12 : pos === 'QB' ? 0.06 : 0.09;
  return age <= peak ? Math.min(1.15, 1 + 0.03 * (peak - age)) : Math.max(0.35, 1 - fall * (age - peak));
}
function estimateValues(players, vs, type, allPlayers) {
  const pairs = {};
  if (vs.alt) vs.list.forEach(x => {
    const a = (x.espn && vs.alt.byEspn.get(x.espn)) || vs.alt.byKey.get(x.key + '|' + x.pos);
    if (a && a.value > 0 && x.value > 0) (pairs[x.pos] = pairs[x.pos] || []).push({ a: a.value, m: x.value, age: x.age || a.age });
  });
  const posVals = {};
  vs.list.forEach(x => (posVals[x.pos] = posVals[x.pos] || []).push(x.value));
  for (const k in posVals) posVals[k].sort((a, b) => a - b);
  const pct = (arr, q) => arr && arr.length ? arr[Math.floor((arr.length - 1) * q)] : 0;
  const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  players.forEach(p => {
    if (p.est !== null) return;
    if (type === 'dynasty' && SEASON_ENDING[p.name] && p.altValue > 0 && !(pairs[p.pos] && pairs[p.pos].length >= 5)) { /* fall through to conversion */ }
    if (type === 'redraft' && SEASON_ENDING[p.name]) {
      p.value = Math.max(10, Math.round((p.altValue || 300) * 0.01)); p.est = 'season'; p.estWhy = SEASON_ENDING[p.name] + ', so almost no value for the rest of this season.'; return;
    }
    if (p.altValue > 0 && pairs[p.pos] && pairs[p.pos].length >= 5) {
      const near = pairs[p.pos].map(q => ({ q, d: Math.abs(Math.log(q.a) - Math.log(p.altValue)) + (p.age && q.age ? 0.12 * Math.abs(p.age - q.age) : 0) }))
        .sort((x, y) => x.d - y.d).slice(0, 10).map(x => x.q.m / x.q.a);
      let v = p.altValue * median(near);
      let why = 'Converted from his ' + (type === 'redraft' ? 'dynasty' : 'redraft') + ' value (' + Math.round(p.altValue).toLocaleString('en-US') + ') using similar ' + p.pos + 's.';
      if (p.age) why += ' Compared with players near his age (' + p.age.toFixed(1) + ').';
      const f = (type === 'redraft' ? INJ_FACTOR : DYN_INJ_FACTOR)[p.inj];
      if (f) { v *= f; why += ' Discounted ' + Math.round((1 - f) * 100) + '% because ESPN lists him as ' + p.inj.replace('_', ' ').toLowerCase() + '.'; }
      p.value = Math.max(10, Math.round(Math.min(v, pct(posVals[p.pos], 1) || v))); p.est = 'convert'; p.estWhy = why; return;
    }
    if (p.pos === 'K' || p.pos === 'D/ST') {
      p.value = p.owned != null ? Math.round(30 + 1.5 * p.owned) : 40; p.est = 'floor';
      p.estWhy = 'FantasyCalc doesn\'t value kickers or defenses; small value' + (p.owned != null ? ' based on ESPN roster % (' + Math.round(p.owned) + '%).' : '.'); return;
    }
    const floor = Math.max(10, Math.round(pct(posVals[p.pos], 0.1) || 25));
    if (p.owned != null) {
      const peers = allPlayers.filter(q => q.pos === p.pos && q.est === '' && q.owned != null && q.value > 0 && Math.abs(q.owned - p.owned) <= 15)
        .sort((a, b) => Math.abs(a.owned - p.owned) - Math.abs(b.owned - p.owned)).slice(0, 8).map(q => q.value);
      if (peers.length >= 3) {
        let v = Math.min(median(peers) * 0.7, pct(posVals[p.pos], 0.25));
        v *= (type === 'redraft' ? INJ_FACTOR : DYN_INJ_FACTOR)[p.inj] || 1;
        if (type === 'dynasty') v *= ageFactor(p.pos, p.age);
        p.value = Math.round(Math.max(floor, v)); p.est = 'owned';
        p.estWhy = 'Not in FantasyCalc. Estimated from valued ' + p.pos + 's with a similar ESPN roster % (' + Math.round(p.owned) + '%).'; return;
      }
    }
    p.value = floor; p.est = 'floor'; p.estWhy = 'Not in FantasyCalc, so he gets a depth-player value for a ' + p.pos + '.';
  });
}
/* Real-world news adjustments (injuries, role changes, trades), kept in news.json and refreshed daily. */
function applyNews(players, news, type, today) {
  if (!news || !Array.isArray(news.items)) return;
  today = today || new Date().toISOString().slice(0, 10);
  const live = news.items.filter(x => !x.until || x.until >= today);
  const byEspn = new Map(), byName = new Map();
  live.forEach(x => { if (x.espn) byEspn.set(String(x.espn), x); byName.set(nk(x.name), x); });
  players.forEach(p => {
    const x = (p.espn && byEspn.get(String(p.espn))) || byName.get(nk(p.name));
    if (!x) return;
    const f = typeof x.factor === 'number' ? x.factor : x[type];
    p.news = { note: x.note, date: x.date, factor: f == null ? 1 : f };
    if (f != null && f !== 1 && p.value > 0) { p.value = Math.max(f < 0.05 ? 10 : 1, Math.round(p.value * f)); p.newsAdj = true; }
  });
}
function applyOverrides(players, overrides) {
  if (!overrides) return;
  players.forEach(p => { if (overrides[p.id] != null) { p.value = +overrides[p.id]; p.est = 'manual'; p.estWhy = 'Value you set by hand.'; } });
}

function lineup(players, slots, key) {
  key = key || 'value';
  const avail = players.filter(p => p.slot !== 21).slice().sort((a, b) => (b[key] || 0) - (a[key] || 0));
  const used = new Set(), starters = [];
  let value = 0;
  for (const s of SLOT_ORDER) {
    const n = +(slots && slots[s]) || 0;
    for (let i = 0; i < n; i++) {
      const p = avail.find(q => !used.has(q.id) && SLOT_ELIG[s].includes(q.pos));
      if (p) { used.add(p.id); value += p[key] || 0; }
      starters.push({ slot: s, p: p || null });
    }
  }
  return { starters, used, value };
}

function analyzeTeam(t, slots) {
  const lu = lineup(t.players, slots);
  t.lineup = lu;
  t.starterValue = lu.value;
  t.totalValue = t.players.reduce((a, p) => a + p.value, 0);
  t.pos = {}; t.depth = {};
  SKILL.forEach(p => { t.pos[p] = 0; t.depth[p] = 0; });
  lu.starters.forEach(s => { if (s.p && t.pos[s.p.pos] !== undefined) t.pos[s.p.pos] += s.p.value; });
  t.players.forEach(p => { if (!lu.used.has(p.id) && t.depth[p.pos] !== undefined) t.depth[p.pos] += p.value; });
}

function rankTeams(teams) {
  const rankBy = (get) => {
    const sorted = teams.slice().sort((a, b) => get(b) - get(a));
    const r = new Map();
    sorted.forEach((t, i) => r.set(t.id, i + 1));
    return r;
  };
  const metrics = { starter: t => t.starterValue, total: t => t.totalValue };
  SKILL.forEach(p => { metrics[p] = t => t.pos[p]; metrics['d' + p] = t => t.depth[p]; });
  const ranks = {};
  for (const k in metrics) ranks[k] = rankBy(metrics[k]);
  const n = teams.length;
  teams.forEach(t => {
    t.rank = {};
    for (const k in ranks) t.rank[k] = ranks[k].get(t.id);
    t.needs = SKILL.filter(p => t.rank[p] > Math.ceil(n * 0.6));
    t.surplus = SKILL.filter(p => !t.needs.includes(p) && (t.rank[p] <= Math.ceil(n * 0.35) || t.rank['d' + p] <= Math.ceil(n * 0.25)));
  });
}

function buildModel(lg, vs) {
  const teams = lg.teams.map(t => Object.assign({}, t, { players: t.roster.map(r => mkPlayer(r, vs, t.id)), picks: [] }));
  const everyone = [].concat(...teams.map(t => t.players));
  estimateValues(everyone, vs, lg.type === 'dynasty' ? 'dynasty' : 'redraft', everyone);
  applyNews(everyone, typeof NEWS !== 'undefined' ? NEWS : null, lg.type === 'dynasty' ? 'dynasty' : 'redraft');
  applyOverrides(everyone, lg.valueOverrides);
  const picks = lg.type === 'dynasty' ? draftPicks(lg, vs, teams) : [];
  const byId = new Map(teams.map(t => [t.id, t]));
  picks.forEach(p => { const t = byId.get(p.owner); if (t) t.picks.push(p); });
  teams.forEach(t => { analyzeTeam(t, lg.slots); t.pickValue = t.picks.reduce((a, p) => a + p.value, 0); t.totalValue += t.pickValue; });
  rankTeams(teams);
  const players = new Map();
  teams.forEach(t => t.players.concat(t.picks).forEach(p => players.set(p.id, p)));
  /* Free agents: ESPN's list when the sync provided it, otherwise FantasyCalc players on no roster. */
  let freeAgents, faSource;
  if (Array.isArray(lg.fa) && lg.fa.length) {
    freeAgents = lg.fa.map(r => Object.assign(mkPlayer([r[0], r[1], r[2], r[3], 20, r[5], r[6]], vs, null), { waivers: !!r[4] }));
    estimateValues(freeAgents, vs, lg.type === 'dynasty' ? 'dynasty' : 'redraft', everyone.concat(freeAgents));
    applyNews(freeAgents, typeof NEWS !== 'undefined' ? NEWS : null, lg.type === 'dynasty' ? 'dynasty' : 'redraft');

async function fcValues(qbs, n, ppr) {

      const j = await (await fetch('https://api.fantasycalc.com/values/current?isDynasty=' + dyn + '&numQbs=' + qbs + '&numTeams=' + teams + '&ppr=' + ppr)).json();

  if (!d) d = await one(true, 12);

}

  if (r.status === 401 || r.status === 403) throw new Error('This league is private. Ask your commissioner to turn on “League Viewable to Public” in ESPN league settings, then sync again.');
  if (r.status === 404) throw new Error('ESPN has no league with ID ' + id + ' for ' + yr + '. Check the ID.');
  if (!r.ok) throw new Error('ESPN answered ' + r.status + '. Try again in a minute.');

  const S = L.settings || {}, slots = (S.rosterSettings || {}).lineupSlotCounts || {};
  const rec = ((S.scoringSettings || {}).scoringItems || []).find(i => i.statId === 53);
  const pts = rec ? (rec.points || (rec.pointsOverrides && Object.values(rec.pointsOverrides)[0]) || 0) : 0;
  const ppr = pts >= 0.75 ? 1 : pts >= 0.25 ? 0.5 : 0;

  const r1 = x => x == null ? null : Math.round(x * 10) / 10;

    return {

      owner: (t.owners || []).map(x => mem[x]).filter(Boolean).join(', '), mine: false,

      roster: ((t.roster || {}).entries || []).map(e => {
        const p = (e.playerPoolEntry || {}).player || {};
        const st = p.stats || [];
        const pj = st.find(s => s.scoringPeriodId === L.scoringPeriodId && s.statSourceId === 1 && s.statSplitTypeId === 1);
        const sa = st.find(s => s.scoringPeriodId === 0 && s.statSourceId === 0 && s.statSplitTypeId === 0 && (!s.seasonId || s.seasonId === yr));

      })
    };
  });
  if (!teams.length) throw new Error('ESPN returned no teams for this league.');
  progress('Loading free agents and NFL schedule…');
  let fa = null, nfl = null;
  const trades = [];
  try {
    const filter = { players: { filterStatus: { value: ['FREEAGENT', 'WAIVERS'] }, filterSlotIds: { value: [0, 2, 4, 6, 16, 17] }, limit: 150, sortPercOwned: { sortPriority: 1, sortAsc: false } } };
    const fr = await fetch(base + '?view=kona_player_info', { headers: { 'x-fantasy-filter': JSON.stringify(filter) } });
    if (fr.ok) fa = ((await fr.json()).players || []).map(x => { const p = x.player || {}; return [x.id || p.id, p.fullName || '', p.defaultPositionId || 0, p.proTeamId || 0, x.status === 'WAIVERS' ? 1 : 0, p.injuryStatus || '', p.ownership && p.ownership.percentOwned != null ? r1(p.ownership.percentOwned) : null]; });
  } catch (e) {}
  try {
    const sj = await (await fetch(ESPN + '/seasons/' + yr + '?view=proTeamSchedules_wl')).json();
    const tn = {};
    ((sj.settings || {}).proTeams || []).forEach(t => {
      if (!t.id) return;
      const g = {};
      Object.keys(t.proGamesByScoringPeriod || {}).forEach(w => { const x = t.proGamesByScoringPeriod[w][0]; if (x) g[w] = x.homeProTeamId === t.id ? x.awayProTeamId : x.homeProTeamId; });
      tn[t.id] = { a: String(t.abbrev || '').toUpperCase(), bye: t.byeWeek, g };

    const pa = {};

      (st.children || []).forEach(c => ((c.standings || {}).entries || []).forEach(e => {
        const v = {}; (e.stats || []).forEach(s => { v[s.name] = s.value; });

function ideasWithBlock(m, opts, base) {
  const b = blockOf(m.lg);

  const seen = new Set(base.map(x => x.give.map(p => p.id).join() + '>' + x.get.map(p => p.id).join()));

function valueChart(m, t) {

/* Snapshots: history for the chart and the previous rosters for the rival tracker. */
function recordHistory(lg) {
  const m = modelFor(lg);
  if (!m) return;
  lg.history = (lg.history || []).filter(s => s && s.t);
  const snap = snapshot(m), last = lg.history[lg.history.length - 1];
  if (last && Math.abs(last.d - snap.d) < 3 * 3600e3) lg.history[lg.history.length - 1] = snap; else lg.history.push(snap);
  if (lg.history.length > 80) lg.history = lg.history.slice(-80);
}

/* ---------- Search any player ---------- */
function globalPlayer(m, id) {
  if (!ALLPLAYERS || !ALLPLAYERS.players) return null;
  const pid = String(id).replace(/^e/, '');
  const row = ALLPLAYERS.players.find(x => String(x[0]) === pid);
  if (!row) return null;
  const [espn, name, posId, pro, owned] = row;
  const pos = POS[posId] || '?';
  const fc = m.vs.byEspn.get(String(espn)) || m.vs.byKey.get(nk(name) + '|' + pos);
  const p = { id: 'e' + espn, espn: String(espn), name, pos, team: (fc && fc.team) || PRO[pro] || 'FA', proTeam: pro, slot: 20, inj: '', value: fc ? fc.value : 0, fcValue: fc ? fc.value : 0, age: fc ? fc.age : null, trend: fc ? fc.trend : 0, owner: null, owned, est: fc ? '' : null };
  if (!fc) { p.est = 'floor'; p.estWhy = 'Not valued by FantasyCalc; deep depth player.'; p.value = pos === 'K' || pos === 'D/ST' ? Math.round(30 + 1.5 * (owned || 0)) : Math.round(10 + (owned || 0) * 4); }
  applyNews([p], NEWS, m.lg.type === 'dynasty' ? 'dynasty' : 'redraft');
  return p;
}
function searchPool(m) {
  const seen = new Set(), out = [];
  const add = p => { if (p && !seen.has(p.id)) { seen.add(p.id); out.push(p); } };
  m.teams.forEach(t => t.players.forEach(add));
  (m.freeAgents || []).forEach(add);
  return { out, seen };
}
function openSearch() {
  const d = $('#modal');
  d.innerHTML = '<div class="modal-card sheet wide search-sheet" role="dialog" aria-modal="true" aria-label="Search players"><div class="row" style="margin:0"><input id="gq" type="search" autocomplete="off" placeholder="Search any NFL player or 2027 prospect" style="flex:1"><button class="x" id="pClose" aria-label="Close">×</button></div><div id="gres" class="gres"></div></div>';
  d.hidden = false;
  const close = () => { d.hidden = true; };
  $('#pClose').onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  const run = () => {
    const q = nk($('#gq').value), m = model(), box = $('#gres');
    if (!q) { box.innerHTML = '<p class="muted small pad">Every active NFL player' + (ALLPLAYERS ? ' (' + ALLPLAYERS.players.length.toLocaleString('en-US') + ')' : '') + ', plus this year’s rookie prospects.</p>'; return; }
    const pool = searchPool(m), hits = pool.out.filter(p => p.pos !== 'PICK' && nk(p.name).includes(q));
    if (ALLPLAYERS) ALLPLAYERS.players.forEach(r => { if (hits.length < 60 && !pool.seen.has('e' + r[0]) && nk(r[1]).includes(q)) { const p = globalPlayer(m, r[0]); if (p) hits.push(p); } });
    m.vs.list.forEach(x => { if (x.pos !== 'PICK' && !pool.seen.has(x.id) && !hits.some(h => h.id === x.id) && nk(x.name).includes(q)) hits.push(Object.assign({ owner: null }, x)); });
    hits.sort((a, b) => (nk(a.name).startsWith(q) ? 0 : 1) - (nk(b.name).startsWith(q) ? 0 : 1) || b.value - a.value);
    const pros = ROOKIES.filter(r => nk(r[0]).includes(q)).slice(0, 5);
    const status = p => { if (p.owner != null) { const t = m.byId.get(p.owner); return t ? (t.id === m.lg.myTeamId ? '<span class="fair good">Yours</span>' : '<span class="tb" style="background:#4a5160">' + esc(t.abbrev || t.name) + '</span>') : ''; } return '<span class="fair mid">' + (p.waivers ? 'Waivers' : 'Free agent') + '</span>'; };
    box.innerHTML = (hits.slice(0, 25).map(p => '<button class="gr" data-act="gplayer" data-id="' + esc(p.id) + '">' + playerLine(p) + '<span class="gr-r">' + status(p) + '<b class="num">' + fmt(p.value) + '</b></span></button>').join('') +
      (pros.length ? '<div class="tierh">2027 prospects</div>' + pros.map(r => '<button class="gr" data-act="prospect" data-name="' + esc(r[0]) + '"><div class="pl">' + '<span class="av" style="background:var(--' + r[1].toLowerCase() + ')">' + esc(initials(r[0])) + '</span><div class="pl-text"><div class="pl-main"><span class="pl-name">' + esc(r[0]) + '</span></div><div class="pl-meta">' + posChip(r[1]) + '<span>' + esc(r[2]) + '</span></div></div></div><span class="gr-r"><span class="fair good">#' + (ROOKIES.indexOf(r) + 1) + '</span></span></button>').join('') : '')) ||
      '<p class="muted small pad">No players match.</p>';
  };
  $('#gq').addEventListener('input', run);
  run();
  $('#gq').focus();
}

  try {
    const [a, st, gl] = await Promise.all([fetch(base).then(r => r.json()), fetch(base + '/stats').then(r => r.json()).catch(() => ({})), fetch(base + '/gamelog').then(r => r.json()).catch(() => ({}))]);
    const at = a.athlete || a;
    const bio = [at.age ? 'Age ' + at.age : '', at.displayHeight && at.displayWeight ? at.displayHeight + ', ' + at.displayWeight : '', at.displayExperience || '', at.college && at.college.name ? at.college.name : '', at.displayDraft || ''].filter(Boolean).join(' · ');
    const cur = c => { const rows = (c.statistics || []); const last = rows[rows.length - 1]; return last && last.season ? { y: last.season.year, v: Object.fromEntries((c.labels || []).map((l, i) => [l, last.stats[i]])) } : null; };
    const cats = {}; (st.categories || []).forEach(c => { const x = cur(c); if (x) cats[c.name] = x; });
    const parts = [];
    if (cats.passing && +String(cats.passing.v.ATT || 0).replace(/,/g, '') > 0) parts.push(cats.passing.v.YDS + ' pass yds, ' + cats.passing.v.TD + ' TD, ' + cats.passing.v.INT + ' INT');
    if (cats.rushing && +String(cats.rushing.v.CAR || 0).replace(/,/g, '') > 0) parts.push(cats.rushing.v.CAR + ' car, ' + cats.rushing.v.YDS + ' rush yds, ' + cats.rushing.v.TD + ' TD');
    if (cats.receiving && +String(cats.receiving.v.REC || 0).replace(/,/g, '') > 0) parts.push(cats.receiving.v.REC + ' rec (' + (cats.receiving.v.TGTS || '?') + ' tgt), ' + cats.receiving.v.YDS + ' yds, ' + cats.receiving.v.TD + ' TD');
    const gp = (cats.rushing || cats.receiving || cats.passing || {}).v || {};
    const season = (cats.rushing || cats.receiving || cats.passing || {}).y;
    let games = '';
    const reg = (gl.seasonTypes || []).find(s => /Regular/.test(s.displayName)) || (gl.seasonTypes || [])[0];
    const evs = reg && reg.categories && reg.categories[0] ? reg.categories[0].events || [] : [];
    if (evs.length) {
      const labels = gl.labels || [], names = gl.names || [];
      const pick = (row, name) => { const i = names.indexOf(name); return i >= 0 ? row.stats[i] : null; };
      const line = row => {
        const bits = [];
        const pyd = pick(row, 'passingYards'), ptd = pick(row, 'passingTouchdowns'), car = pick(row, 'rushingAttempts'), ryd = pick(row, 'rushingYards'), rtd = pick(row, 'rushingTouchdowns'), rec = pick(row, 'receptions'), cyd = pick(row, 'receivingYards'), ctd = pick(row, 'receivingTouchdowns');
        if (pyd != null && +pyd) bits.push(pyd + ' pass yds' + (+ptd ? ', ' + ptd + ' TD' : ''));
        if (car != null && +car) bits.push(car + '-' + ryd + (+rtd ? ', ' + rtd + ' TD' : ''));
        if (rec != null && +rec) bits.push(rec + ' rec ' + cyd + ' yds' + (+ctd ? ', ' + ctd + ' TD' : ''));
        return bits.join(' · ') || labels.slice(0, 3).map((l, i) => l + ' ' + row.stats[i]).join(' · ');
      };
      games = '<h3 class="mt">Last ' + Math.min(5, evs.length) + ' games</h3><table class="roster"><tbody>' + evs.slice(0, 5).map(row => { const e = (gl.events || {})[row.eventId] || {}; return '<tr><td class="slot">Wk ' + (e.week || '') + '</td><td class="small">' + esc((e.atVs || '') + ' ' + ((e.opponent || {}).abbreviation || '')) + ' <span class="' + (e.gameResult === 'W' ? 'pos-d' : 'neg-d') + '">' + esc((e.gameResult || '') + ' ' + (e.score || '')) + '</span></td><td class="small">' + esc(line(row)) + '</td></tr>'; }).join('') + '</tbody></table>';
    }
    el.innerHTML = (bio ? '<p class="small muted">' + esc(bio) + '</p>' : '') + (parts.length ? '<h3 class="mt">' + (season || '') + ' season' + (gp.GP ? ' · ' + gp.GP + ' games' : '') + '</h3><p class="small">' + parts.map(esc).join('<br>') + '</p>' : '') + games + '<p class="small muted">Live from ESPN.</p>';
  } catch (e) { el.innerHTML = '<p class="muted small">Couldn’t load ESPN stats right now.</p>'; }
}

function loadLocal() {

function save(changed) {

  if (store.mode === 'account') {
    (changed || []).forEach(id => store.dirty.add(id));

const ucol = () => store.db.collection('data/users/' + store.uid);

async function flushRemote() {
  try {
    const ids = [...store.dirty]; store.dirty.clear();
    for (const id of ids) {
      const ref = ucol().doc(ldoc(id));
      if (S.leagues[id]) await ref.set({ json: JSON.stringify(S.leagues[id]) }); else await ref.delete();
    }
    await ucol().doc('meta').set({ order: S.order, active: S.active, updated: S.updated, values: S.values ? JSON.stringify(S.values) : '' });
  } catch (e) {

const timeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);
async function connect() {
  if (!(window.claude && window.claude.use)) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;

      const m = meta.data(), leagues = {};
      for (const id of m.order || []) {

        if (d.exists) { try { leagues[id] = JSON.parse(d.data().json); } catch (e) {} }

const vsCache = new Map();

function valueSource(lg) {

  if (lg && lg.values && lg.values[type]) return { type, txt: lg.values[type], asOf: lg.values.asOf, desc: lg.values.teams + '-team ' + p(lg.values) };
  if (S.values && S.values[type]) return { type, txt: S.values[type], asOf: S.values.asOf, desc: '12-team PPR' };

function idx(txt) {

}
function getVS(lg) {
  const src = valueSource(lg);
  const other = valueSource(Object.assign({}, lg, { type: src.type === 'dynasty' ? 'redraft' : 'dynasty' }));
  return Object.assign({ src, alt: idx(other.txt) }, idx(src.txt));
}

  let c = modelCache.get(lg.id);

  return c.m;
}

    save(changed);
    const lg = S.leagues[L.id];
    return { ok: true, msg: 'Synced ' + L.name + ': ' + L.teams.length + ' teams' + (j.values ? ' and fresh trade values' : '') + '.', needTeam: lg.myTeamId == null, id: L.id };
  }
  if (j.values) {
    S.values = j.values;
    save([]);
    return { ok: true, msg: 'Trade values updated (' + when(j.values.asOf) + ').' };
  }
  return { ok: false, msg: 'Nothing to import in that data.' };
}

function avatar(p, size) {

function buyLowSellHigh(m, me) {
  const buy = [], sell = [];
  m.teams.forEach(t => t.players.forEach(p => {
    if (!SKILL.includes(p.pos) || p.value < 1000) return;
    const r = p.trend / p.value;
    if (t.id !== me.id && r <= -0.15 && (me.needs.includes(p.pos) || !me.needs.length)) buy.push(p);
    if (t.id === me.id && r >= 0.15) sell.push(p);
  }));
  return { buy: buy.sort((a, b) => a.trend / a.value - b.trend / b.value).slice(0, 6), sell: sell.sort((a, b) => b.trend / b.value - a.trend / a.value).slice(0, 6) };
}

function viewCalc(m) {
  const c = ui.calc;
  if (c.aTeam == null && m.lg.myTeamId != null) c.aTeam = m.lg.myTeamId;
  const A = c.a.map(id => asset(m, id)).filter(Boolean), B = c.b.map(id => asset(m, id)).filter(Boolean);
  const f = fairness(A, B);
  const tA = m.byId.get(+c.aTeam), tB = m.byId.get(+c.bTeam);
  const side = (key, list, team, label) => {
    const total = list.reduce((s, p) => s + p.value, 0);
    return '<section class="card side"><div class="side-head"><h3>' + label + '</h3>' + teamSelect(key === 'a' ? 'aTeam' : 'bTeam', team ? team.id : null, 'Any team') + '</div>' +
      '<div class="assets">' + (list.map(p => '<div class="asset">' + playerLine(p, { dyn: m.lg.type === 'dynasty' }) + '<span class="num">' + fmt(p.value) + '</span><button class="x" data-act="rm" data-side="' + key + '" data-id="' + esc(p.id) + '" aria-label="Remove ' + esc(p.name) + '">×</button></div>').join('') || '<p class="muted small empty">Add players' + (m.lg.type === 'dynasty' ? ' or picks' : '') + ' below.</p>') + '</div>' +
      '<div class="search"><input id="q-' + key + '" type="search" autocomplete="off" placeholder="Add a player' + (m.lg.type === 'dynasty' ? ' or pick' : '') + '…" data-side="' + key + '" value="' + (ui.search.side === key ? esc(ui.search.q) : '') + '"><div class="results" id="r-' + key + '"></div></div>' +
      '<div class="side-total"><span>Raw total ' + fmt(total) + '</span><b>Trade value ' + fmt(key === 'a' ? f.ta : f.tb) + '</b></div></section>';
  };
  let verdict = '', extra = '';
  if (A.length && B.length) {
    const pct = Math.round(f.pct * 100), abs = Math.abs(f.diff);
    const cls = Math.abs(f.pct) < 0.05 ? 'good' : Math.abs(f.pct) < 0.12 ? 'mid' : 'bad';
    const sa = tA ? teamName(tA) : 'Side A', sb = tB ? teamName(tB) : 'Side B';
    const head = Math.abs(f.pct) < 0.05 ? 'Fair trade' : f.diff > 0 ? sa + ' wins by ' + fmt(abs) : sb + ' wins by ' + fmt(abs);
    const share = f.ta + f.tb ? Math.round(f.ta / (f.ta + f.tb) * 100) : 50;
    verdict = '<section class="card verdict ' + cls + '"><div class="v-head">' + head + '<small>' + (Math.abs(pct) < 5 ? 'within 5% either way' : Math.abs(pct) + '% gap in trade value') + '</small></div>' +
      '<div class="split"><div class="split-a" style="width:' + share + '%"><span>' + fmt(f.ta) + '</span></div><div class="split-b"><span>' + fmt(f.tb) + '</span></div></div>' +
      '<p class="muted small">Trade value counts a package as worth less than the sum of its players, because the side getting the single best player also frees a roster spot.</p>';
    if (Math.abs(f.pct) >= 0.05) {
      const aShort = f.ta < f.tb;
      const shortSide = aShort ? 'a' : 'b', shortList = aShort ? A : B, longList = aShort ? B : A, shortTeam = aShort ? tA : tB;
      const pool = shortTeam ? shortTeam.players : m.vs.list;
      const ex = new Set(c.a.concat(c.b));
      const bal = balancers(shortList, longList, pool, ex);
      if (bal.length) verdict += '<div class="even"><b>To even it out, ' + (shortTeam ? teamName(shortTeam) : 'the short side') + ' could add:</b>' + bal.map(x => '<button class="chip" data-act="add" data-side="' + shortSide + '" data-id="' + esc(x.p.id) + '">' + esc(x.p.name) + ' · ' + fmt(x.p.value) + '</button>').join('') + '</div>';
    }
    if (tA && tB && tA.id !== tB.id) {
      const pa = A.filter(p => p.owner === tA.id), pb = B.filter(p => p.owner === tB.id);
      const dA = lineup(swapPlayers(tA.players, pa, B.filter(p => SKILL.includes(p.pos))), m.lg.slots).value - tA.starterValue;
      const dB = lineup(swapPlayers(tB.players, pb, A.filter(p => SKILL.includes(p.pos))), m.lg.slots).value - tB.starterValue;
      verdict += '<div class="impact big"><span class="' + (dA >= 0 ? 'pos-d' : 'neg-d') + '">' + teamName(tA) + ' starters ' + sgn(dA) + '</span><span class="' + (dB >= 0 ? 'pos-d' : 'neg-d') + '">' + teamName(tB) + ' starters ' + sgn(dB) + '</span></div>';
    }
    verdict += '<div class="v-actions"><button class="btn ghost" data-act="swapSides">Swap sides</button><button class="btn ghost" data-act="clearCalc">Clear</button></div></section>';
  } else if (B.length && tA) {
    const target = f.tb, ex = new Set(c.b);
    const pk = findPackages(tA.players.concat(tA.picks), target, m.lg.slots, tA.starterValue, ex);
    extra = '<section class="card verdict"><div class="v-head">Offers from ' + teamName(tA) + '<small>packages worth about ' + fmt(target) + ' that cost your lineup the least</small></div>' +
      (pk.map((x, i) => '<button class="offer" data-act="usePkg" data-i="' + i + '"><span>' + x.give.map(p => esc(p.name)).join(' + ') + '</span><span class="num">' + fmt(x.v) + '</span><span class="muted small">starters ' + sgn(-x.loss) + '</span></button>').join('') || '<p class="muted">No package on this roster matches that value.</p>') + '</section>';
    ui._pkgs = pk;
  } else {
    verdict = '<section class="card verdict"><div class="v-head">Build a trade<small>Add what each side sends. Put players on the right only and the app will suggest what you could offer.</small></div></section>';
  }
  return '<section class="head-row"><h2>Trade calculator</h2><div class="ctrl"><span class="muted small">Values: FantasyCalc ' + esc(m.lg.type) + '</span></div></section>' +
    '<div class="calc">' + side('a', A, tA, tA && tA.id === m.lg.myTeamId ? 'You give' : (tA ? teamName(tA) + ' gives' : 'Side A gives')) + side('b', B, tB, tB ? teamName(tB) + ' gives' : 'Side B gives') + '</div>' + verdict + counterCard(m, A, B, tA, tB) + extra;
}

function standingsCard(m) {
  const po = playoffOdds(m);
  if (!po) return '<section class="card"><h3>Standings</h3><p class="muted small">Standings with playoff odds need your league\u2019s schedule. Reinstall the sync bookmark from the Sync tab, then sync again.</p></section>';
  const me = m.lg.myTeamId;
  return '<section class="card tablewrap"><div style="padding:16px 16px 0"><h3>Standings and playoff odds</h3><p class="muted small" style="margin:0 0 8px">' + po.spots + ' teams make the playoffs. Odds come from simulating the ' + po.remaining + ' regular-season games left 4,000 times, using each team\u2019s scoring so far and its current lineup.</p></div>' +
    '<table class="league"><thead><tr><th>#</th><th>Team</th><th class="num">W-L</th><th class="num hide-sm">PF/G</th><th>Playoffs</th><th class="num hide-sm">Proj W</th><th class="num hide-sm">#1 seed</th></tr></thead><tbody>' +
    po.rows.map((r, i) => '<tr class="' + (r.t.id === me ? 'me' : '') + (i === po.spots - 1 ? ' cut' : '') + '"><td class="num">' + (i + 1) + '</td><td><div class="tcell">' + fteamAvatar(r.t, 'sm') + '<button class="link" data-act="openTeam" data-id="' + r.t.id + '">' + teamName(r.t) + '</button></div></td>' +
      '<td class="num">' + r.rec.w + '-' + r.rec.l + (r.rec.t ? '-' + r.rec.t : '') + '</td><td class="num hide-sm">' + r.ppg.toFixed(1) + '</td>' +
      '<td><div class="odds"><div class="odds-bar"><i style="width:' + Math.round(r.odds * 100) + '%;background:' + (r.odds >= 0.75 ? 'var(--good)' : r.odds >= 0.25 ? 'var(--mid)' : 'var(--bad)') + '"></i></div><b class="small">' + (r.odds > 0.995 ? '>99' : r.odds < 0.005 ? '<1' : Math.round(r.odds * 100)) + '%</b></div></td>' +
      '<td class="num hide-sm">' + r.projW.toFixed(1) + '</td><td class="num hide-sm">' + Math.round(r.top * 100) + '%</td></tr>').join('') + '</tbody></table></section>';
}

function viewLeague(m) {

    '<tr class="' + (t.id === m.lg.myTeamId ? 'me' : '') + '"><td class="num">' + t.rank.starter + '</td><td><div class="tcell">' + fteamAvatar(t, 'sm') + '<div><button class="link" data-act="openTeam" data-id="' + t.id + '">' + teamName(t) + '</button><div class="muted small">' + esc(t.owner || '') + '</div></div></div></td>' +
    '<td class="num">' + t.w + '–' + t.l + (t.t ? '–' + t.t : '') + '</td><td class="num">' + fmt(t.starterValue) + '</td><td class="num hide-sm">' + fmt(t.totalValue) + '</td>' + (dynL ? '<td class="num hide-sm">' + fmt(t.pickValue) + '</td>' : '') +

    '<div class="card tablewrap"><table class="league"><thead><tr><th>#</th><th>Team</th><th>Record</th><th>Starters</th><th class="hide-sm">Roster</th>' + (dynL ? '<th class="hide-sm">Picks</th>' : '') + SKILL.map(p => '<th class="c">' + p + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + managersCard(m) + rivalsCard(m) + gradesCard(m) + recordsCard(m);
}

  return '<section class="card"><h3>Add a league</h3><p class="small">Paste your league\u2019s ESPN link, or just its league ID. The ID is the number after <b>leagueId=</b> in the address when you open your league on espn.com. The league has to be public: your commissioner turns on <b>League Viewable to Public</b> in ESPN\u2019s league settings.</p>' +

    '<div class="row mt"><button class="btn" data-act="pwaSyncAll">Sync all leagues now</button><span class="muted small">The app also syncs automatically when you open it, if it\u2019s been more than 6 hours.</span></div>';

    '<details><summary>Can’t drag it?</summary><p>Copy the code below, then right-click the bookmarks bar, choose <b>Add page…</b> (Chrome) or <b>Add Bookmark…</b>, name it “Trade Desk Sync”, and paste the code into the URL field.</p><button class="btn ghost" data-act="copyBm">Copy bookmark code</button> <span id="bmMsg" class="muted small"></span></details></li>' +

        '<label class="small">Format <select data-act="ltype" data-id="' + esc(l.id) + '"><option value="redraft"' + (l.type === 'redraft' ? ' selected' : '') + '>Redraft</option><option value="dynasty"' + (l.type === 'dynasty' ? ' selected' : '') + '>Dynasty</option></select></label>' +
        (l.type === 'dynasty' ? '<label class="small">Rookie draft rounds <select data-act="lrounds" data-id="' + esc(l.id) + '">' + [1, 2, 3, 4].map(r => '<option value="' + r + '"' + ((l.pickRounds || 3) === r ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></label>' : '') +

function picksCard(m, t) {
  const n = m.teams.length;
  const order = draftOrder(m.teams);
  const years = [...new Set(m.picks.map(p => p.year))];
  const owned = t.picks.slice().sort((a, b) => a.year - b.year || a.round - b.round || (a.pickNo || 0) - (b.pickNo || 0));
  const gone = m.picks.filter(p => p.orig === t.id && p.owner !== t.id);
  const ownerSel = p => '<select data-act="pickOwner" data-id="' + esc(p.id) + '" aria-label="Owner of ' + esc(p.name) + '">' + m.teams.map(x => '<option value="' + x.id + '"' + (x.id === p.owner ? ' selected' : '') + '>' + esc(x.abbrev || x.name) + '</option>').join('') + '</select>';
  const row = p => '<tr><td>' + playerLine(p) + '</td><td class="num">' + fmt(p.value) + '</td><td class="c">' + ownerSel(p) + '</td></tr>';
  const myslot = order.findIndex(x => x.id === t.id) + 1;
  return '<section class="card mt"><div class="head-row"><h3>Draft picks · ' + fmt(t.pickValue) + ' value</h3><span class="muted small">' + years[0] + ' projection: pick ' + myslot + ' of ' + n + ' in every round</span></div>' +
    '<p class="muted small">Not a snake: the worst record picks first in every round, so ' + years[0] + ' slots are projected from current standings and update each time you sync. Later years use FantasyCalc’s average value for the round. When you trade a pick, change its owner here.</p>' +
    '<div class="tablewrap"><table class="roster"><tbody>' + (owned.map(row).join('') || '<tr><td class="muted">No picks.</td></tr>') + '</tbody></table></div>' +
    (gone.length ? '<p class="small muted mt">Traded away: ' + gone.map(p => esc(p.name) + ' to ' + teamName(m.byId.get(p.owner))).join(', ') + '</p>' : '') + '</section>';
}

function viewWeekly(m) {
  const me = m.byId.get(m.lg.myTeamId);
  if (!me) return '<section class="card"><h2>Weekly</h2><p>Choose your team first.</p>' + teamSelect('setMine', null, 'Pick your team') + '</section>';
  const dyn = m.lg.type === 'dynasty', n = m.teams.length;
  const resync = '<p class="muted small">Your last sync didn\u2019t include this data. Reinstall the sync bookmark from the Sync tab (it was updated), then sync again.</p>';
  // Start / sit
  const ss = startSit(m, me);
  let ssHtml;
  if (!ss) ssHtml = resync;
  else {
    const week = m.lg.week ? 'Week ' + m.lg.week : 'This week';
    ssHtml = '<div class="ss-head"><div><div class="tile-k">' + esc(week) + ' projection, your lineup now</div><div class="tile-v">' + ss.curPts.toFixed(1) + '</div></div><div><div class="tile-k">Best possible</div><div class="tile-v">' + ss.bestPts.toFixed(1) + '</div></div></div>' +
      (ss.gain > 0.05 && ss.ins.length ? '<div class="grid-io"><div><div class="side-k">Put in your lineup</div>' + ss.ins.map(p => '<div class="row-pl">' + playerLine(p) + '<span class="num">' + (p.proj || 0).toFixed(1) + '</span></div>').join('') + '</div>' +
        '<div><div class="side-k">Move to bench</div>' + ss.outs.map(p => '<div class="row-pl">' + playerLine(p) + '<span class="num">' + (p.proj || 0).toFixed(1) + '</span></div>').join('') + '</div></div>' +
        '<p class="pos-d num">+' + ss.gain.toFixed(1) + ' projected points</p>' :
        '<p class="good-t">Your ESPN lineup already matches ESPN\u2019s projections. Nothing to change.</p>') +
      '<p class="muted small">Projections are ESPN\u2019s, from your last sync. Check injury news before kickoff and sync again on game day.</p>';
  }
  // Waivers
  const wv = waiverTargets(m, me);
  const wvHtml = (m.faSource === 'fc' ? '<p class="muted small">Using FantasyCalc players who aren\u2019t on any roster in your league. Reinstall the sync bookmark to pull ESPN\u2019s real free-agent list, including who\u2019s on waivers.</p>' : '') +
    (wv.list.length ? '<table class="roster"><tbody>' + wv.list.map(x => '<tr><td>' + playerLine(x.p, { dyn }) + (x.p.waivers ? '<span class="estb">on waivers</span>' : '') + '</td><td class="num">' + fmt(x.p.value) + '</td><td class="num small ' + (x.gain > 0 ? 'pos-d' : 'muted') + '">' + (x.gain > 0 ? 'starters ' + sgn(x.gain) : dyn ? 'stash' : 'depth') + (x.projGain ? '<br>' + (x.projGain > 0 ? '+' : '') + x.projGain.toFixed(1) + ' pts' : '') + '</td></tr>').join('') + '</tbody></table>' +
      (wv.drop ? '<p class="small muted">Suggested drop: <b>' + esc(wv.drop.name) + '</b> (' + fmt(wv.drop.value) + '), your lowest-value bench player.</p>' : '') : '<p class="muted">No available player beats your bench right now.</p>');
  // Playoff schedule
  const sc = scheduleStrength(m);
  let scHtml;
  if (!sc) scHtml = m.lg.demo ? '<p class="muted small">Shows each starter\u2019s fantasy-playoff opponents once you sync a real league.</p>' : resync;
  else {
    const mine = sc.teams.find(x => x.t.id === me.id);
    const cell = g => !g.opp ? '<td class="c muted">?</td>' : g.opp === 'BYE' ? '<td class="c"><span class="opp bye">BYE</span></td>' : '<td class="c"><span class="opp ' + (g.ease >= 1.08 ? 'easy' : g.ease <= 0.92 ? 'hard' : 'mid') + '" title="' + (g.pa ? g.pa + ' points allowed per game' : '') + '">' + esc(g.opp) + '</span></td>';
    scHtml = '<p class="small">Your starters rank <b>' + ord(mine.rank) + ' of ' + n + '</b> for playoff schedule (weeks ' + sc.weeks.join(', ') + ')' + (mine.byes ? ', with <b class="bad-t">' + mine.byes + ' bye' + (mine.byes > 1 ? 's' : '') + '</b> to plan around' : '') + '. Green is a defense allowing lots of points, red a stingy one.</p>' +
      '<div class="tablewrap"><table class="roster sched"><thead><tr><th></th>' + sc.weeks.map(w => '<th class="c small muted">Wk ' + w + '</th>').join('') + '</tr></thead><tbody>' +
      mine.rows.map(r => '<tr><td>' + playerLine(r.p) + '</td>' + r.g.map(cell).join('') + '</tr>').join('') + '</tbody></table></div>' +
      '<details class="mt"><summary>League playoff schedule ranking</summary><table class="roster"><tbody>' + sc.teams.slice().sort((a, b) => a.rank - b.rank).map(x => '<tr class="' + (x.t.id === me.id ? 'me' : '') + '"><td class="num">' + x.rank + '</td><td>' + teamName(x.t) + '</td><td class="num small">' + (x.ease * 100 - 100 >= 0 ? '+' : '') + Math.round(x.ease * 100 - 100) + '% vs avg</td><td class="small muted">' + (x.byes ? x.byes + ' bye' + (x.byes > 1 ? 's' : '') : '') + '</td></tr>').join('') + '</tbody></table></details>';
  }
  const mu = matchup(m);
  let muHtml = '';
  if (mu && mu.bye) muHtml = '<section class="card"><h3>This week</h3><p>No matchup this week.</p></section>';
  else if (mu) {
    const wp = mu.winP != null ? Math.round(mu.winP * 100) : null;
    const slotRows = (a, b) => {
      const order = SLOT_ORDER;
      const pick = (list, s, used) => { const p = list.find(x => +x.slot === s && !used.has(x.id)); if (p) used.add(p.id); return p; };
      const ua = new Set(), ub = new Set(), rows = [];
      order.forEach(s => { for (let k = 0; k < (+m.lg.slots[s] || 0); k++) { const pa = pick(a, s, ua), pb = pick(b, s, ub); if (pa || pb) rows.push([s, pa, pb]); } });
      return rows.map(([s, pa, pb]) => '<div>' + (pa ? avatar(pa, 'sm') + '<span class="pl-name" data-act="player" data-id="' + esc(pa.id) + '" role="button" tabindex="0">' + esc(pa.name) + '</span><span class="muted">' + (pa.proj != null ? pa.proj.toFixed(1) : '') + '</span>' : '<span class="muted">Empty</span>') + '</div><div class="s">' + esc(SLOT_NAME[s]) + '</div><div class="r">' + (pb ? '<span class="muted">' + (pb.proj != null ? pb.proj.toFixed(1) : '') + '</span><span class="pl-name" data-act="player" data-id="' + esc(pb.id) + '" role="button" tabindex="0">' + esc(pb.name) + '</span>' + avatar(pb, 'sm') : '<span class="muted">Empty</span>') + '</div>').join('');
    };
    muHtml = '<section class="card"><h3>Week ' + (m.lg.week || mu.mp) + ' matchup</h3>' +
      '<div class="mu"><div class="mu-team">' + fteamAvatar(mu.me, 'lg') + '<div class="mu-name">' + teamName(mu.me) + '</div><div class="mu-pts">' + (mu.havePj ? mu.myProj.toFixed(1) : '—') + '</div><div class="small muted">' + mu.me.w + '–' + mu.me.l + (mu.live[0] ? ' · ' + mu.live[0] + ' scored' : '') + '</div></div>' +
      '<div class="mu-vs">VS</div>' +
      '<div class="mu-team">' + fteamAvatar(mu.opp, 'lg') + '<div class="mu-name">' + teamName(mu.opp) + '</div><div class="mu-pts">' + (mu.havePj ? mu.oppProj.toFixed(1) : '—') + '</div><div class="small muted">' + mu.opp.w + '–' + mu.opp.l + (mu.live[1] ? ' · ' + mu.live[1] + ' scored' : '') + '</div></div></div>' +
      (wp != null ? '<div class="wp" role="img" aria-label="Win chance ' + wp + ' percent"><i style="width:' + wp + '%"></i></div><div class="row small" style="justify-content:space-between;margin-top:0"><b>' + wp + '% to win</b><span class="muted">' + (100 - wp) + '%</span></div>' : '<p class="small muted">Projections come with the updated sync bookmark.</p>') +
      (mu.havePj ? '<div class="mu-lines">' + slotRows(mu.myLine, mu.oppLine) + '</div><p class="small muted">Projected points from the lineups set on ESPN at your last sync. Win chance assumes normal week-to-week swings.</p>' : '') + '</section>';
  }
  return '<section class="head-row"><h2>Weekly</h2></section>' + (muHtml ? muHtml + '<div class="mt"></div>' : '') +
    '<div class="grid2"><section class="card"><h3>Start / sit</h3>' + ssHtml + '</section><section class="card"><h3>Waiver pickups</h3><p class="muted small">Best available players compared with your bench' + (dyn ? ', weighted toward younger stashes' : ', ranked by how much they\u2019d help your lineup') + '.</p>' + wvHtml + '</section></div>' +
    '<section class="card mt"><h3>Playoff schedule</h3>' + scHtml + '</section>' + plannerCard(m, me);
}

function managersCard(m) {
  const profs = managerProfiles(m);
  const me = m.byId.get(m.lg.myTeamId);
  const tracked = profs.length && profs[0].tracked;
  const best = profs.filter(x => me && x.t.id !== me.id).sort((a, b) => b.fit - a.fit).slice(0, 3).filter(x => x.fit > 0);
  const dyn = m.lg.type === 'dynasty';
  const posList = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([p, k]) => p + (k > 1 ? ' ×' + k : '')).join(', ') || '—';
  return '<section class="card mt"><h3>Managers</h3>' +
    (best.length ? '<div class="partners"><b>Best trade partners for you:</b><ol>' + best.map(x => '<li><b>' + teamName(x.t) + '</b>: ' + esc(x.reasons.slice(0, 2).join('; ')) + (x.trades ? '; active trader (' + x.trades + ' trade' + (x.trades > 1 ? 's' : '') + ')' : '') + '. <button class="link small" data-act="tradeWith" data-id="' + x.t.id + '">See trades</button></li>').join('') + '</ol></div>' : '') +

function rookieOrder() {
  const names = ROOKIES.map(r => r[0]);
  if (ui.board !== 'mine' || !Array.isArray(S.rookieBoard)) return ROOKIES;
  const by = new Map(ROOKIES.map(r => [r[0], r]));
  const order = S.rookieBoard.filter(n => by.has(n));
  names.forEach(n => { if (!order.includes(n)) order.push(n); });
  return order.map(n => by.get(n));
}

      '<div class="pr-pick"><span class="pk' + (isMine ? ' mine' : '') + '">' + label + '</span>' + (own ? '<div class="small muted">' + (isMine ? 'Your pick' : esc(own.abbrev || own.name)) + '</div>' : '') +

function showResults(side, q) {
  const m = model(), box = $('#r-' + side);
  if (!box) return;
  q = nk(q);
  if (!q) { box.innerHTML = ''; return; }
  if (side === 's') {
    const me = m.byId.get(m.lg.myTeamId);
    const out = me ? me.players.concat(me.picks).filter(p => p.value > 0 && nk(p.name + ' ' + (p.alias || '')).includes(q)).sort((a, b) => b.value - a.value) : [];
    box.innerHTML = out.slice(0, 8).map(p => '<button class="res" data-act="setShop" data-id="' + esc(p.id) + '">' + avatar(p, 'sm') + '<span>' + esc(p.name) + '</span><span class="muted small">' + esc(p.pos) + '</span><span class="num">' + fmt(p.value) + '</span></button>').join('') || '<div class="muted small pad">No players on your roster match</div>';
    return;
  }
  if (side === 't') {

    m.teams.forEach(t => { if (t.id !== m.lg.myTeamId) t.players.concat(t.picks).forEach(p => { if (p.value > 0 && nk(p.name + ' ' + (p.alias || '')).includes(q)) out.push(p); }); });
    out.sort((a, b) => b.value - a.value);
    box.innerHTML = out.slice(0, 8).map(p => { const own = m.byId.get(p.owner); return '<button class="res" data-act="setTarget" data-id="' + esc(p.id) + '">' + avatar(p, 'sm') + '<span>' + esc(p.name) + '</span><span class="muted small">' + esc(own ? own.abbrev || own.name : '') + '</span><span class="num">' + fmt(p.value) + '</span></button>'; }).join('') || '<div class="muted small pad">No players on other teams match</div>';
    return;
  }
  const c = ui.calc, team = m.byId.get(+(side === 'a' ? c.aTeam : c.bTeam));

  const seen = new Set(), out = [];
  const consider = p => {
    if (seen.has(p.id) || taken.has(p.id) || !(SKILL.includes(p.pos) || p.pos === 'PICK' || p.pos === 'K' || p.pos === 'D/ST') || !nk(p.name + ' ' + (p.alias || '')).includes(q)) return;
    seen.add(p.id); out.push(p);
  };
  if (team) team.players.forEach(consider);
  if (team) team.picks.forEach(consider);
  m.teams.forEach(t => t.players.concat(t.picks).forEach(consider));
  m.vs.list.forEach(p => { if (p.pos === 'PICK' && (m.lg.type !== 'dynasty' || m.picks.length)) return; consider(p); });
  box.innerHTML = out.slice(0, 8).map(p => {
    const own = p.owner != null ? m.byId.get(p.owner) : null;
    return '<button class="res" data-act="add" data-side="' + side + '" data-id="' + esc(p.id) + '">' + avatar(p, 'sm') + '<span>' + esc(p.name) + '</span><span class="muted small">' + (own ? esc(own.abbrev || own.name) : p.pos === 'PICK' ? 'pick' : 'not rostered') + '</span><span class="num">' + fmt(p.value) + '</span></button>';
  }).join('') || '<div class="muted small pad">No matches</div>';
}

    (p.proj != null ? kv('Proj this week', p.proj.toFixed(1)) : '') + (p.avg != null ? kv('Season avg', p.avg.toFixed(1)) : '') + (p.owned != null ? kv('Rostered', Math.round(p.owned) + '%') : '') + '</div>' +
    (p.est ? '<p class="small muted">* ' + esc(p.estWhy || '') + '</p>' : '') +
    (p.news ? '<div class="newsbox"><b>News · ' + esc(when(p.news.date)) + '</b><p>' + esc(p.news.note) + '</p>' + (p.newsAdj ? '<span class="small muted">Value adjusted ' + (p.news.factor < 1 ? 'down ' + Math.round((1 - p.news.factor) * 100) + '%' : 'up ' + Math.round((p.news.factor - 1) * 100) + '%') + ' for this.</span>' : '') + '</div>' : '') +
    '<div id="pLive"></div>' +
    (games && games.length ? '<h3 class="mt">Fantasy playoffs</h3><div class="row">' + games.map(g => '<div class="c"><div class="small muted">Wk ' + g.w + '</div>' + (g.opp === 'BYE' ? '<span class="opp bye">BYE</span>' : g.opp ? '<span class="opp ' + (g.ease >= 1.08 ? 'easy' : g.ease <= 0.92 ? 'hard' : 'mid') + '">' + esc(g.opp) + '</span>' : '<span class="muted">?</span>') + '</div>').join('') + '</div>' : '') +
    '<div class="row mt">' +
    (own && own.id !== me ? '<button class="btn" id="pTarget">Build offers for him</button><button class="btn ghost" id="pCalc">Add to calculator</button>' : '') +
    (own && own.id === me ? '<button class="btn" id="pTrade">Find trades for him</button><button class="btn ghost" id="pShop">Add to calculator</button>' : '') +
    (own ? '<button class="btn ghost" id="pBlock">' + (own.id === me ? (blockOf(lg).sell.includes(p.id) ? 'Remove from trade block' : 'Put on trade block') : (blockOf(lg).want.includes(p.id) ? 'Remove from wishlist' : 'Add to wishlist')) + '</button>' : '') +
    (!isPick && m.players.get(p.id) ? '<button class="btn ghost" id="pEdit">Change value</button>' : '') + '</div></div>';
  d.hidden = false;
  const close = () => { d.hidden = true; };
  $('#pClose').onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  if ($('#pTarget')) $('#pTarget').onclick = () => { close(); ui.ideaTarget = p.id; go('ideas'); };
  if ($('#pCalc')) $('#pCalc').onclick = () => { close(); if (!ui.calc.b.includes(p.id)) ui.calc.b.push(p.id); ui.calc.bTeam = p.owner; go('calc'); };
  if ($('#pTrade')) $('#pTrade').onclick = () => { close(); ui.ideaTarget = null; ui.ideaShop = p.id; go('ideas'); };
  if ($('#pShop')) $('#pShop').onclick = () => { close(); if (!ui.calc.a.includes(p.id)) ui.calc.a.push(p.id); ui.calc.aTeam = p.owner; go('calc'); };
  if ($('#pEdit')) $('#pEdit').onclick = () => editValue(p.id);
  loadLive(p);
  if ($('#pBlock')) $('#pBlock').onclick = () => {
    const b = blockOf(lg), k = own.id === me ? 'sell' : 'want';
    b[k] = b[k].includes(p.id) ? b[k].filter(x => x !== p.id) : b[k].concat(p.id);
    save([lg.id]); close(); render();
  };
  $('#pClose').focus();
}
function editValue(id) {
  const m = model(), p = m.players.get(id), lg = S.leagues[S.active];
  if (!p) return;
  const d = $('#modal');
  const base = p.est === 'manual' ? null : p.value;
  d.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="evh"><h3 id="evh">' + esc(p.name) + '</h3>' +
    '<p class="small muted">' + (p.est ? esc(p.estWhy || '') : 'FantasyCalc ' + esc(lg.type) + ' value: ' + fmt(p.fcValue)) + '</p>' +
    '<label class="small" for="evIn">Value used everywhere in the app</label><input id="evIn" type="number" inputmode="numeric" min="0" step="10" value="' + Math.round(p.value) + '">' +
    '<div class="row"><button class="btn" id="evSave">Save</button>' + (lg.type === 'redraft' ? '<button class="btn ghost" id="evOut">Out for season</button>' : '') + (p.est === 'manual' ? '<button class="btn ghost" id="evReset">Reset</button>' : '') + '<button class="btn ghost" id="evNo">Cancel</button></div></div>';
  d.hidden = false;
  const done = v => {
    lg.valueOverrides = lg.valueOverrides || {};
    if (v == null) delete lg.valueOverrides[id]; else lg.valueOverrides[id] = Math.max(0, Math.round(v));
    d.hidden = true; save([lg.id]); render();
  };
  $('#evIn').focus();
  $('#evSave').onclick = () => { const v = parseFloat($('#evIn').value); if (!isNaN(v)) done(v); };
  $('#evIn').onkeydown = e => { if (e.key === 'Enter') $('#evSave').click(); };
  if ($('#evOut')) $('#evOut').onclick = () => done(Math.max(10, Math.round((p.altValue || p.value || 1000) * 0.01)));
  if ($('#evReset')) $('#evReset').onclick = () => done(null);
  $('#evNo').onclick = () => { d.hidden = true; };
}
let syncing = false;
async function runSync(ids, quiet) {
  if (syncing || !ids.length) return;
  syncing = true;
  try { renderHeader(); } catch (e) {}
  const say = (t, cls) => { const el = $('#syncMsg'); if (el) { el.className = 'small mt ' + (cls || ''); el.textContent = t; } if (quiet || !el) { const b = $('#banner'); if (b) b.innerHTML = t ? '<div class="banner">' + esc(t) + '</div>' : ''; } };
  const done = [];
  try {
    for (const id of ids) {
      const name = (S.leagues[id] || {}).name || 'league ' + id;
      try {
        const payload = await espnSync(id, t => say(name + ': ' + t));
        const r = importText(JSON.stringify(payload));
        if (!r.ok) throw new Error(r.msg);
        done.push(payload.league.name);
      } catch (e) { say(name + ': ' + e.message, 'bad-t'); syncing = false; render(); say(name + ': ' + e.message, 'bad-t'); return; }
    }
    syncing = false;
    render();
    say('Synced ' + done.join(' and ') + '.', 'good-t');
    if (quiet) setTimeout(() => { const b = $('#banner'); if (b && b.textContent.startsWith('Synced')) renderHeader(); }, 4000);
  } finally { syncing = false; }
}
function confirmBox(text, onYes) {
  const d = $('#modal');
  d.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true"><p>' + esc(text) + '</p><div class="row"><button class="btn danger" id="mYes">Remove</button><button class="btn ghost" id="mNo">Cancel</button></div></div>';
  d.hidden = false;
  $('#mYes').onclick = () => { d.hidden = true; onYes(); };
  $('#mNo').onclick = () => { d.hidden = true; };
}

window.addEventListener('hashchange', route);
loadLocal();
/* Keep leagues fresh: sync on open and whenever the app comes back to the screen, if data is over 30 minutes old. */
function autoSync() {
  if (!PWA || syncing) return;
  const stale = S.order.filter(id => !S.leagues[id].demo && Date.now() - (S.leagues[id].syncedAt || 0) > 30 * 60e3);
  if (stale.length) runSync(stale, true);
}
if (PWA) {
  setTimeout(autoSync, 600);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); else return; renderHeader(); });
  setInterval(() => { if (document.visibilityState === 'visible') renderHeader(); }, 60000);
}
try { S.order.forEach(id => { const l = S.leagues[id]; if (l && !l.demo && !(l.history && l.history.length)) recordHistory(l); }); } catch (e) {}
ensureLeague();
route();
connect();

</script>
