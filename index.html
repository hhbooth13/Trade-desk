<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Desk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<title>Trade Desk</title>
<style>
/* Layout idea: a phone-first fantasy app. Black chrome, charcoal cards, one blue accent, team-color badges carry identity. Single dark theme by choice. */
:root {
  --bg: #23272f; --surface: #2e333d; --surface2: #393f4b; --ink: #f2f4f7; --muted: #aab2be; --line: #434a57;
  --accent: #3d8bff; --accent-ink: #ffffff; --accent-soft: rgba(61, 139, 255, .16); --chrome: #191c22; --chrome-ink: #ffffff;
  --good: #34c76f; --good-soft: rgba(52, 199, 111, .15); --mid: #f2b705; --mid-soft: rgba(242, 183, 5, .15); --bad: #ff5a5f; --bad-soft: rgba(255, 90, 95, .15);
  --qb: #d6457f; --rb: #1fb37a; --wr: #3d8bff; --te: #f08a24; --pick: #8b93a1;
  --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h2 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mt { margin-top: 16px; }
.lead { max-width: 70ch; margin: 0 0 14px; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- chrome ---- */
.top { background: var(--chrome); color: var(--chrome-ink); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #2b3039; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mark { font: 900 15px var(--display); background: var(--accent); color: #fff; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; flex: none; letter-spacing: -.02em; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.sub { font-size: 12px; color: #8d939c; }
.leagues { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ltab { background: #262a32; color: #e6e8eb; border: 1px solid #3a404b; border-radius: 999px; padding: 5px 12px; cursor: pointer; text-decoration: none; display: flex; gap: 6px; align-items: baseline; font-weight: 700; font-size: 13px; }
.ltab small { font-weight: 600; font-size: 10px; color: #8d939c; text-transform: uppercase; letter-spacing: .06em; }
.ltab.on { background: #fff; color: #000; border-color: #fff; }
.ltab.on small { color: #555; }
.syncb { gap: 6px; align-items: center; }
.syncb .spin { display: inline-block; font-size: 15px; line-height: 1; }
.syncb.busy .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ltab.add { border-style: dashed; color: #b8bec6; background: transparent; }
.tabs { background: var(--chrome); display: flex; gap: 2px; padding: 0 20px; overflow-x: auto; border-bottom: 1px solid #2b3039; }
.tabs a { color: #aeb5bf; text-decoration: none; padding: 11px 13px; font: 700 13px var(--display); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tabs a svg { width: 18px; height: 18px; flex: none; }
.tabs a.on { color: #fff; border-bottom-color: var(--accent); }
.tabs a:hover { color: #fff; }
main { padding: 20px; max-width: 1180px; margin: 0 auto; }
#banner { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid rgba(61,139,255,.45); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.head-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
select, input[type=search], textarea, input[type=number] { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: 100%; color: var(--ink); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; cursor: pointer; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.ghost.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile-k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tile-v { font: 800 20px var(--display); letter-spacing: -.01em; }
.tile-s { font-size: 12px; color: var(--muted); }

/* ---- identity: avatars, team badges, position chips ---- */
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 800 13px var(--display); color: #fff; flex: none; box-shadow: inset 0 0 0 2px var(--ring, rgba(255,255,255,.25)); letter-spacing: -.02em; }
.av.lg { width: 64px; height: 64px; font-size: 22px; box-shadow: inset 0 0 0 3px var(--ring, rgba(255,255,255,.25)); }
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.av.pick { background: #4a5160; color: #cfd4da; border-radius: 10px; }
.tb { display: inline-block; font: 800 10px var(--display); padding: 2px 6px; border-radius: 5px; color: #fff; letter-spacing: .03em; border-left: 3px solid var(--ring, transparent); }
.pos { display: inline-block; min-width: 30px; text-align: center; font: 800 10px var(--display); padding: 2px 5px; border-radius: 5px; color: #fff; background: var(--pick); letter-spacing: .03em; }
.pos-QB { background: var(--qb); } .pos-RB { background: var(--rb); } .pos-WR { background: var(--wr); } .pos-TE { background: var(--te); }
.pos-K, .pos-DST { background: #5b6270; }
.rank { display: inline-block; font: 800 12px var(--display); padding: 2px 8px; border-radius: 999px; min-width: 38px; text-align: center; }
.rank.good, .fair.good { background: var(--good-soft); color: var(--good); }
.rank.mid, .fair.mid { background: var(--mid-soft); color: var(--mid); }
.rank.bad { background: var(--bad-soft); color: var(--bad); }
.trend { font-size: 12px; font-weight: 700; }
.trend.up { color: var(--good); } .trend.down { color: var(--bad); }
.inj { font-size: 10px; font-weight: 800; color: #fff; background: var(--bad); padding: 1px 5px; border-radius: 4px; text-transform: uppercase; }
.age { font-size: 12px; }
.estb { font-size: 11px; font-weight: 700; color: var(--mid); background: var(--mid-soft); padding: 0 6px; border-radius: 999px; cursor: help; }
.av.has-img { position: relative; overflow: hidden; }
.av-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface2); border-radius: inherit; }
.subtabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin: 0 0 14px; max-width: 360px; }
.subtabs a { flex: 1; text-align: center; padding: 7px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font: 700 13px var(--display); }
.subtabs a.on { background: var(--surface2); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.subtabs a:hover { color: var(--ink); }
.waiver-adj { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; font-size: 12px; color: var(--muted); }
.waiver-adj b { color: var(--good, #3ccf7a); }
.gchip.wa { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
@media (max-width: 560px) { .tf-grid { grid-template-columns: 1fr; } }
.tf-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; min-height: 26px; }
.tf-res { margin-top: 4px; max-height: 220px; overflow-y: auto; }
.modal-card.wide { max-width: 560px; }
.search-sheet { min-height: 60vh; }
.gres { margin-top: 10px; display: flex; flex-direction: column; }
.gr { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 2px; text-align: left; cursor: pointer; }
.gr:hover { background: var(--accent-soft); }
.gr .pl { pointer-events: none; }
.gr-r { display: flex; gap: 8px; align-items: center; flex: none; }
.ltab.gs { align-items: center; }
.prospect { cursor: pointer; }
.prospect:hover { border-color: var(--accent); }
.boards td { padding: 7px 4px; }
.newsb { font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); padding: 0 6px; border-radius: 999px; cursor: help; }
.newsbox { background: var(--accent-soft); border: 1px solid rgba(61,139,255,.4); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
.newsbox p { margin: 4px 0; font-size: 14px; }
.estb.man { color: var(--accent); background: var(--accent-soft); }

/* player line */
.pl { display: flex; gap: 10px; align-items: center; min-width: 0; cursor: pointer; border-radius: 10px; }
.pl:hover .pl-name { color: var(--accent); }
.pl-text { min-width: 0; }
.pl-main { display: flex; gap: 6px; align-items: center; min-width: 0; }
.pl-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.pl-meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; align-items: center; margin-top: 2px; }
.vbtn { font: inherit; font-weight: 700; background: none; border: 1px dashed transparent; border-radius: 8px; padding: 2px 6px; cursor: pointer; color: var(--ink); }
.vbtn:hover, .vbtn:focus-visible { border-color: var(--accent); }

/* bars */
.pbar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 60px; gap: 10px; align-items: center; margin: 12px 0; }
.pbar-l { display: flex; gap: 6px; align-items: center; }
.pbar-track { position: relative; height: 10px; background: var(--surface2); border-radius: 5px; }
.pbar-fill { height: 100%; border-radius: 5px; background: var(--mid); }
.pbar-fill.good { background: var(--good); } .pbar-fill.bad { background: var(--bad); }
.pbar-avg { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; opacity: .7; border-radius: 1px; }
.pbar-v { font-weight: 700; text-align: right; font-size: 13px; }

table { border-collapse: collapse; width: 100%; }
.roster td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.roster tr:last-child td { border-bottom: 0; }
.roster tr.me td, .league tr.me td { background: var(--accent-soft); }
.slot { width: 52px; font: 800 11px var(--display); color: var(--muted); text-transform: uppercase; }

/* trade ideas */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.idea-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.idea-team { font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.fair { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.idea-sides { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
.idea-sides .pl { margin-bottom: 8px; }
.side-k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; display: block; }
.side-v { font-weight: 700; color: var(--muted); font-size: 13px; }
.arrow { align-self: center; font-size: 18px; color: var(--accent); }
.impact { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 700; font-size: 13px; }
.impact.big { font-size: 14px; margin-top: 10px; }
.pos-d { color: var(--good); } .neg-d { color: var(--bad); }
.why { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.why li { margin: 3px 0; }
.idea .btn { align-self: flex-start; margin-top: auto; }
.row-pl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row-pl > .small { grid-column: 1 / -1; padding-left: 46px; }

/* calculator */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.side { display: flex; flex-direction: column; gap: 10px; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.side-head h3 { margin: 0; }
.assets { display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
.asset { display: grid; grid-template-columns: minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; padding: 8px; background: var(--surface2); border-radius: 12px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.x:hover { color: var(--bad); }
.empty { padding: 18px 0; text-align: center; }
.search { position: relative; }
.search input { width: 100%; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 30; overflow: hidden; }
.results:empty { display: none; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; width: 100%; padding: 9px 10px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.res:hover, .res:focus { background: var(--accent-soft); }
.pad { padding: 10px; }
.side-total { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
.verdict { border-left: 4px solid var(--line); }
.verdict.good { border-left-color: var(--good); } .verdict.mid { border-left-color: var(--mid); } .verdict.bad { border-left-color: var(--bad); }
.v-head { font: 800 19px var(--display); display: flex; flex-direction: column; margin-bottom: 10px; }
.v-head small { font: 400 13px var(--body); color: var(--muted); }
.split { display: flex; height: 30px; border-radius: 999px; overflow: hidden; font-weight: 800; font-size: 13px; }
.split-a { background: var(--accent); color: #fff; display: flex; align-items: center; padding: 0 12px; min-width: 64px; }
.split-b { flex: 1; background: #4a5160; color: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; min-width: 64px; }
.even { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: 13px; font-weight: 700; }
.chip.on { background: #fff; color: #000; border-color: #fff; }
.v-actions { display: flex; gap: 8px; margin-top: 12px; }
.offer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; margin-top: 8px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.offer:hover { border-color: var(--accent); }
.target { margin-bottom: 12px; padding: 12px 16px; }
.target-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.target-row + .target-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tlabel { min-width: 120px; }
.grow { flex: 1; min-width: 200px; }
.tchip { display: inline-flex; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 6px 4px 6px; font-weight: 700; }

/* league tables */
.tablewrap { overflow-x: auto; }
.card.tablewrap { padding: 0; }
.league th, .league td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.league th { font: 800 11px var(--display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.league .num { text-align: right; }
.league .c { text-align: center; }
.league tr.cut td { border-bottom: 2px dashed var(--accent); }
.mu-lines .pl-name { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcell { display: flex; gap: 10px; align-items: center; }
.odds { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.odds-bar { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.odds-bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }

/* weekly */
.mu { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.mu-team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.mu-name { font-weight: 800; overflow-wrap: anywhere; }
.mu-pts { font: 900 26px var(--display); letter-spacing: -.02em; }
.mu-vs { font-weight: 800; color: var(--muted); }
.wp { height: 10px; border-radius: 5px; background: #4a5160; overflow: hidden; margin: 12px 0 4px; }
.wp i { display: block; height: 100%; background: var(--accent); }
.mu-lines { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 0 8px; margin-top: 12px; font-size: 13px; }
.mu-lines > div { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; min-width: 0; }
.mu-lines .r { justify-content: flex-end; text-align: right; }
.mu-lines .s { justify-content: center; color: var(--muted); font: 800 10px var(--display); }
.ss-head { display: flex; gap: 24px; margin-bottom: 10px; }
.grid-io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.opp { display: inline-block; min-width: 44px; font: 800 12px var(--display); padding: 4px 6px; border-radius: 6px; text-align: center; }
.opp.easy { background: var(--good-soft); color: var(--good); }
.opp.mid { background: var(--surface2); color: var(--ink); }
.opp.hard { background: var(--bad-soft); color: var(--bad); }
.opp.bye { background: #fff; color: #000; }
.sched td { padding: 6px 4px; }
.partners ol { margin: 6px 0 12px; padding-left: 20px; font-size: 14px; }
.partners li { margin: 5px 0; }

/* sync */
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 56px; position: relative; }
.steps li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 800 14px var(--display); display: grid; place-items: center; }
.steps h3 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 16px; margin-bottom: 4px; }
.steps p { margin: 4px 0 8px; max-width: 70ch; }
.bm { display: inline-block; background: #fff; color: #000; text-decoration: none; padding: 9px 16px; border-radius: 999px; font-weight: 800; border: 2px dashed var(--accent); cursor: grab; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; }
.lrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow label { display: flex; gap: 6px; align-items: center; }

<div id="modal" hidden></div>
<script>
/* ---------- Core logic: values, lineups, team analysis, trades (no DOM) ---------- */
const POS = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'D/ST' };
const PRO = { 0: 'FA', 1: 'ATL', 2: 'BUF', 3: 'CHI', 4: 'CIN', 5: 'CLE', 6: 'DAL', 7: 'DEN', 8: 'DET', 9: 'GB', 10: 'TEN', 11: 'IND', 12: 'KC', 13: 'LV', 14: 'LAR', 15: 'MIA', 16: 'MIN', 17: 'NE', 18: 'NO', 19: 'NYG', 20: 'NYJ', 21: 'PHI', 22: 'ARI', 23: 'PIT', 24: 'LAC', 25: 'SF', 26: 'SEA', 27: 'TB', 28: 'WAS', 29: 'CAR', 30: 'JAX', 33: 'BAL', 34: 'HOU' };
const SLOT_NAME = { 0: 'QB', 2: 'RB', 4: 'WR', 6: 'TE', 16: 'D/ST', 17: 'K', 3: 'RB/WR', 5: 'WR/TE', 23: 'FLEX', 7: 'SFLEX', 20: 'Bench', 21: 'IR' };
const SLOT_ELIG = { 0: ['QB'], 2: ['RB'], 4: ['WR'], 6: ['TE'], 16: ['D/ST'], 17: ['K'], 3: ['RB', 'WR'], 5: ['WR', 'TE'], 23: ['RB', 'WR', 'TE'], 7: ['QB', 'RB', 'WR', 'TE'] };
const SLOT_ORDER = [0, 2, 4, 6, 16, 17, 3, 5, 23, 7];
const SKILL = ['QB', 'RB', 'WR', 'TE'];
const TRADE_EXP = 1.15;

const nk = s => String(s || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '').replace(/[^a-z0-9]/g, '');

function parseValues(txt) {
  return String(txt || '').trim().split('\n').filter(Boolean).map(l => {
    const [name, pos, team, espn, value, age, trend] = l.split('|');
    const key = nk(name);
    return {
      id: pos === 'PICK' ? 'k' + key : (espn ? 'e' + espn : 'n' + key + pos),
      name, pos, team: team || '', espn: espn || '', value: +value || 0,
      age: age ? +age : null, trend: +trend || 0, key, fa: true
    };
  });
}

function indexValues(list) {
  const byEspn = new Map(), byKey = new Map(), byId = new Map();
  list.forEach(x => {
    if (x.espn) byEspn.set(x.espn, x);
    byKey.set(x.key + '|' + x.pos, x);
    byId.set(x.id, x);
  });
  return { list, byEspn, byKey, byId };
}

function mkPlayer(r, vs, teamId) {
  const [pid, name, posId, pro, slot, inj, owned, proj, avg] = r;
  const pos = POS[posId] || '?';
  const find = ix => ix ? (ix.byEspn.get(String(pid)) || ix.byKey.get(nk(name) + '|' + pos)) : null;
  const fc = find(vs), alt = fc ? null : find(vs.alt);
  return {
    id: 'e' + pid, espn: String(pid), name, pos,
    team: (fc && fc.team) || (alt && alt.team) || PRO[pro] || 'FA', slot, inj: inj && inj !== 'ACTIVE' ? inj : '',
    value: fc ? fc.value : 0, fcValue: fc ? fc.value : 0, age: (fc || alt || {}).age || null, trend: fc ? fc.trend : 0, owner: teamId,
    altValue: alt ? alt.value : 0, owned: owned != null ? +owned : null, est: fc ? '' : null,
    proTeam: pro, proj: proj != null ? +proj : null, avg: avg != null ? +avg : null
  };
}

/* ---------- Estimated values for players FantasyCalc doesn't value ----------
   1. Value in the other format (dynasty <-> redraft): converted with the ratio seen for the
      10 most similar players (value and age) at the same position, then discounted for injuries in redraft.
   2. No FantasyCalc value at all: matched to valued players with similar ESPN roster % at the position,
      or a small positional floor. Kickers and defenses get a small value from roster % (or a flat floor). */
const SEASON_ENDING = {};
const INJ_FACTOR = { INJURY_RESERVE: 0.3, OUT: 0.6, DOUBTFUL: 0.8, QUESTIONABLE: 0.95, SUSPENSION: 0.5 };
/* Dynasty: injuries matter less (there is next season), age matters more. */
const DYN_INJ_FACTOR = { INJURY_RESERVE: 0.85, OUT: 0.95, SUSPENSION: 0.9 };
const PEAK_AGE = { QB: 31, RB: 25, WR: 27, TE: 28 };
function ageFactor(pos, age) {
  const peak = PEAK_AGE[pos];
  if (!peak || !age) return 1;
  const fall = pos === 'RB' ? 0.12 : pos === 'QB' ? 0.06 : 0.09;
  return age <= peak ? Math.min(1.15, 1 + 0.03 * (peak - age)) : Math.max(0.35, 1 - fall * (age - peak));
}
function estimateValues(players, vs, type, allPlayers) {
  const pairs = {};
  if (vs.alt) vs.list.forEach(x => {
    const a = (x.espn && vs.alt.byEspn.get(x.espn)) || vs.alt.byKey.get(x.key + '|' + x.pos);
    if (a && a.value > 0 && x.value > 0) (pairs[x.pos] = pairs[x.pos] || []).push({ a: a.value, m: x.value, age: x.age || a.age });
  });
  const posVals = {};
  vs.list.forEach(x => (posVals[x.pos] = posVals[x.pos] || []).push(x.value));
  for (const k in posVals) posVals[k].sort((a, b) => a - b);
  const pct = (arr, q) => arr && arr.length ? arr[Math.floor((arr.length - 1) * q)] : 0;
  const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  players.forEach(p => {
    if (p.est !== null) return;
    if (type === 'dynasty' && SEASON_ENDING[p.name] && p.altValue > 0 && !(pairs[p.pos] && pairs[p.pos].length >= 5)) { /* fall through to conversion */ }
    if (type === 'redraft' && SEASON_ENDING[p.name]) {
      p.value = Math.max(10, Math.round((p.altValue || 300) * 0.01)); p.est = 'season'; p.estWhy = SEASON_ENDING[p.name] + ', so almost no value for the rest of this season.'; return;
    }
    if (p.altValue > 0 && pairs[p.pos] && pairs[p.pos].length >= 5) {
      const near = pairs[p.pos].map(q => ({ q, d: Math.abs(Math.log(q.a) - Math.log(p.altValue)) + (p.age && q.age ? 0.12 * Math.abs(p.age - q.age) : 0) }))
        .sort((x, y) => x.d - y.d).slice(0, 10).map(x => x.q.m / x.q.a);
      let v = p.altValue * median(near);
      let why = 'Converted from his ' + (type === 'redraft' ? 'dynasty' : 'redraft') + ' value (' + Math.round(p.altValue).toLocaleString('en-US') + ') using similar ' + p.pos + 's.';
      if (p.age) why += ' Compared with players near his age (' + p.age.toFixed(1) + ').';
      const f = (type === 'redraft' ? INJ_FACTOR : DYN_INJ_FACTOR)[p.inj];
      if (f) { v *= f; why += ' Discounted ' + Math.round((1 - f) * 100) + '% because ESPN lists him as ' + p.inj.replace('_', ' ').toLowerCase() + '.'; }
      p.value = Math.max(10, Math.round(Math.min(v, pct(posVals[p.pos], 1) || v))); p.est = 'convert'; p.estWhy = why; return;
    }
    if (p.pos === 'K' || p.pos === 'D/ST') {
      p.value = p.owned != null ? Math.round(30 + 1.5 * p.owned) : 40; p.est = 'floor';
      p.estWhy = 'FantasyCalc doesn\'t value kickers or defenses; small value' + (p.owned != null ? ' based on ESPN roster % (' + Math.round(p.owned) + '%).' : '.'); return;
    }
    const floor = Math.max(10, Math.round(pct(posVals[p.pos], 0.1) || 25));
    if (p.owned != null) {
      const peers = allPlayers.filter(q => q.pos === p.pos && q.est === '' && q.owned != null && q.value > 0 && Math.abs(q.owned - p.owned) <= 15)
        .sort((a, b) => Math.abs(a.owned - p.owned) - Math.abs(b.owned - p.owned)).slice(0, 8).map(q => q.value);
      if (peers.length >= 3) {
        let v = Math.min(median(peers) * 0.7, pct(posVals[p.pos], 0.25));
        v *= (type === 'redraft' ? INJ_FACTOR : DYN_INJ_FACTOR)[p.inj] || 1;
        if (type === 'dynasty') v *= ageFactor(p.pos, p.age);
        p.value = Math.round(Math.max(floor, v)); p.est = 'owned';
        p.estWhy = 'Not in FantasyCalc. Estimated from valued ' + p.pos + 's with a similar ESPN roster % (' + Math.round(p.owned) + '%).'; return;
      }
    }
    p.value = floor; p.est = 'floor'; p.estWhy = 'Not in FantasyCalc, so he gets a depth-player value for a ' + p.pos + '.';
  });
}
/* Real-world news adjustments (injuries, role changes, trades), kept in news.json and refreshed daily. */
function applyNews(players, news, type, today) {
  if (!news || !Array.isArray(news.items)) return;
  today = today || new Date().toISOString().slice(0, 10);
  const live = news.items.filter(x => !x.until || x.until >= today);
  const byEspn = new Map(), byName = new Map();
  live.forEach(x => { if (x.espn) byEspn.set(String(x.espn), x); byName.set(nk(x.name), x); });
  players.forEach(p => {
    const x = (p.espn && byEspn.get(String(p.espn))) || byName.get(nk(p.name));
    if (!x) return;
    const f = typeof x.factor === 'number' ? x.factor : x[type];
    p.news = { note: x.note, date: x.date, factor: f == null ? 1 : f };
    if (f != null && f !== 1 && p.value > 0) { p.value = Math.max(f < 0.05 ? 10 : 1, Math.round(p.value * f)); p.newsAdj = true; }
  });
}
function applyOverrides(players, overrides) {
  if (!overrides) return;
  players.forEach(p => { if (overrides[p.id] != null) { p.value = +overrides[p.id]; p.est = 'manual'; p.estWhy = 'Value you set by hand.'; } });
}

function lineup(players, slots, key) {
  key = key || 'value';
  const avail = players.filter(p => p.slot !== 21).slice().sort((a, b) => (b[key] || 0) - (a[key] || 0));
  const used = new Set(), starters = [];
  let value = 0;
  for (const s of SLOT_ORDER) {
    const n = +(slots && slots[s]) || 0;
    for (let i = 0; i < n; i++) {
      const p = avail.find(q => !used.has(q.id) && SLOT_ELIG[s].includes(q.pos));
      if (p) { used.add(p.id); value += p[key] || 0; }
      starters.push({ slot: s, p: p || null });
    }
  }
  return { starters, used, value };
}

function analyzeTeam(t, slots) {
  const lu = lineup(t.players, slots);
  t.lineup = lu;
  t.starterValue = lu.value;
  t.totalValue = t.players.reduce((a, p) => a + p.value, 0);
  t.pos = {}; t.depth = {};
  SKILL.forEach(p => { t.pos[p] = 0; t.depth[p] = 0; });
  lu.starters.forEach(s => { if (s.p && t.pos[s.p.pos] !== undefined) t.pos[s.p.pos] += s.p.value; });
  t.players.forEach(p => { if (!lu.used.has(p.id) && t.depth[p.pos] !== undefined) t.depth[p.pos] += p.value; });
}

function rankTeams(teams) {
  const rankBy = (get) => {
    const sorted = teams.slice().sort((a, b) => get(b) - get(a));
    const r = new Map();
    sorted.forEach((t, i) => r.set(t.id, i + 1));
    return r;
  };
  const metrics = { starter: t => t.starterValue, total: t => t.totalValue };
  SKILL.forEach(p => { metrics[p] = t => t.pos[p]; metrics['d' + p] = t => t.depth[p]; });
  const ranks = {};
  for (const k in metrics) ranks[k] = rankBy(metrics[k]);
  const n = teams.length;
  teams.forEach(t => {
    t.rank = {};
    for (const k in ranks) t.rank[k] = ranks[k].get(t.id);
    t.needs = SKILL.filter(p => t.rank[p] > Math.ceil(n * 0.6));
    t.surplus = SKILL.filter(p => !t.needs.includes(p) && (t.rank[p] <= Math.ceil(n * 0.35) || t.rank['d' + p] <= Math.ceil(n * 0.25)));
  });
}

/* Short label for each team: the manager's first name (team names and ESPN abbreviations change too often).
   Shared first names get a last initial. Falls back to the ESPN abbreviation when there's no manager name. */
function ownerLabels(teams, lg) {
  if (lg.demo) return;
  const first = t => { const o = String(t.owner || '').split(',')[0].trim(); return o && o !== 'You' ? o : ''; };
  const fn = t => first(t).split(/\s+/)[0] || '';
  const count = {}; teams.forEach(t => { const f = fn(t).toLowerCase(); if (f) count[f] = (count[f] || 0) + 1; });
  teams.forEach(t => {
    const full = first(t), f = fn(t);
    if (!f) return;
    const parts = full.split(/\s+/), last = parts.length > 1 ? parts[parts.length - 1] : '';
    t.espnAbbrev = t.abbrev;
    t.abbrev = count[f.toLowerCase()] > 1 && last ? f + ' ' + last[0].toUpperCase() + '.' : f;
    t.ownerInitials = (f[0] + (last ? last[0] : (f[1] || ''))).toUpperCase();
  });
}
function buildModel(lg, vs) {
  WAIVER_DYNASTY = lg.type === 'dynasty';
  const teams = lg.teams.map(t => Object.assign({}, t, { players: t.roster.map(r => mkPlayer(r, vs, t.id)), picks: [] }));
  ownerLabels(teams, lg);
  const everyone = [].concat(...teams.map(t => t.players));
  estimateValues(everyone, vs, lg.type === 'dynasty' ? 'dynasty' : 'redraft', everyone);
  applyNews(everyone, typeof NEWS !== 'undefined' ? NEWS : null, lg.type === 'dynasty' ? 'dynasty' : 'redraft');
  applyOverrides(everyone, lg.valueOverrides);
  const baked = typeof resolveLeagueTrades === 'function' ? resolveLeagueTrades(lg, teams) : { trades: [], pickOwners: {} };
  const picks = lg.type === 'dynasty' ? draftPicks(Object.assign({}, lg, { pickOwners: Object.assign({}, baked.pickOwners, lg.pickOwners || {}) }), vs, teams) : [];
  const byId = new Map(teams.map(t => [t.id, t]));
  picks.forEach(p => { const t = byId.get(p.owner); if (t) t.picks.push(p); });
  teams.forEach(t => { analyzeTeam(t, lg.slots); t.pickValue = t.picks.reduce((a, p) => a + p.value, 0); t.totalValue += t.pickValue; });
  rankTeams(teams);
  const players = new Map();
  teams.forEach(t => t.players.concat(t.picks).forEach(p => players.set(p.id, p)));
  /* Free agents: ESPN's list when the sync provided it, otherwise FantasyCalc players on no roster. */
  let freeAgents, faSource;
  if (Array.isArray(lg.fa) && lg.fa.length) {
    freeAgents = lg.fa.map(r => Object.assign(mkPlayer([r[0], r[1], r[2], r[3], 20, r[5], r[6]], vs, null), { waivers: !!r[4] }));
    estimateValues(freeAgents, vs, lg.type === 'dynasty' ? 'dynasty' : 'redraft', everyone.concat(freeAgents));
    applyNews(freeAgents, typeof NEWS !== 'undefined' ? NEWS : null, lg.type === 'dynasty' ? 'dynasty' : 'redraft');
    faSource = 'espn';
  } else {
    const rostered = new Set(everyone.map(p => p.espn));
    const keys = new Set(everyone.map(p => nk(p.name) + '|' + p.pos));
    freeAgents = vs.list.filter(x => SKILL.includes(x.pos) && !(x.espn && rostered.has(x.espn)) && !keys.has(x.key + '|' + x.pos))
      .map(x => ({ id: x.id, espn: x.espn, name: x.name, pos: x.pos, team: x.team, slot: 20, inj: '', value: x.value, fcValue: x.value, age: x.age, trend: x.trend, owner: null, est: '' }));
    faSource = 'fc';
  }
  return { lg, vs, teams, byId, players, picks, freeAgents, faSource, bakedTrades: baked.trades };
}

/* ---------- Dynasty draft picks ----------
   Linear (non-snake) order: worst record picks first in every round.
   Next year's picks are valued by projected slot (between FantasyCalc's Early/Mid/Late values);
   later years use FantasyCalc's generic value for that round. */
const ROUND_NAME = { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th' };
function draftOrder(teams) {
  const pct = t => { const g = (t.w || 0) + (t.l || 0) + (t.t || 0); return g ? ((t.w || 0) + 0.5 * (t.t || 0)) / g : 0.5; };
  return teams.slice().sort((a, b) => pct(a) - pct(b) || (a.pf || 0) - (b.pf || 0) || a.id - b.id);
}
function pickValue(vs, year, round, slot, n, projected) {
  const get = s => { const x = vs.byKey.get(nk(year + ' ' + ROUND_NAME[round] + s) + '|PICK'); return x ? x.value : null; };
  const generic = get('');
  if (!projected) return generic;
  const E = get(' (Early)'), M = get(' (Mid)'), L = get(' (Late)');
  if (E == null || M == null || L == null) return generic;
  const t = n > 1 ? (slot - 1) / (n - 1) : 0.5;
  let v;
  if (t <= 0.5) v = E + (M - E) * (t - 1 / 6) / (0.5 - 1 / 6);
  else v = M + (L - M) * (t - 0.5) / (5 / 6 - 0.5);
  return Math.round(Math.min(E * 1.2, Math.max(L * 0.8, v)));
}
function draftPicks(lg, vs, teams) {
  const rounds = Math.min(4, Math.max(1, +lg.pickRounds || 3));
  const next = (+lg.season || new Date().getFullYear()) + 1;
  const order = draftOrder(teams), n = order.length;
  const owners = lg.pickOwners || {};
  const out = [];
  for (let y = next; y < next + 3; y++) {
    for (let r = 1; r <= rounds; r++) {
      order.forEach((t, i) => {
        const slot = i + 1, projected = y === next;
        const value = pickValue(vs, y, r, slot, n, projected);
        if (value == null) return;
        const id = 'pk' + y + '-' + r + '-' + t.id;
        const owner = owners[id] != null && teams.some(x => x.id === owners[id]) ? owners[id] : t.id;
        const label = projected ? y + ' ' + r + '.' + String(slot).padStart(2, '0') : y + ' ' + ROUND_NAME[r];
        out.push({
          id, pos: 'PICK', name: label, alias: y + ' ' + ROUND_NAME[r] + ' round ' + (t.abbrev || '') + ' ' + (t.name || ''), year: y, round: r, pickNo: projected ? slot : null, orig: t.id, owner, value,
          team: (owner !== t.id ? 'via ' + (t.abbrev || t.name) + ' · ' : '') + (projected ? 'projected from standings' : 'round ' + r),
          age: null, trend: 0, slot: 20
        });
      });
    }
  }
  return out;
}

/* Trade value: packages are worth less than the sum of their parts, so one stud beats two good players. */
function tv(vals) {
  const s = vals.reduce((a, v) => a + Math.pow(Math.max(+v || 0, 0), TRADE_EXP), 0);
  return Math.round(Math.pow(s, 1 / TRADE_EXP));
}

/* FantasyCalc's waiver adjustment. When one side gets fewer players, the other side has to cut someone
   to make room, so the side getting fewer players is credited with roster-spot value, based on the
   cheapest extra players on the bigger side:
   Dynasty: min(value x 0.6982, 753 + i x 0.23) per extra player, floored.
   Redraft: min(round(value x 0.42), 550) per extra player, plus 200 for each extra player beyond the first. */
let WAIVER_DYNASTY = true;
const WAIVER = { dynasty: { pct: 0.6982, cap: 753, step: 0.23 }, redraft: { pct: 0.42, cap: 550, extra: 200 } };
function waiverAdj(shortVals, longVals, dyn) {
  const k = longVals.length - shortVals.length;
  if (k <= 0 || !shortVals.length || !longVals.length) return 0;
  const cheapest = longVals.slice().sort((x, y) => x - y).slice(0, k);
  if (dyn) { const w = WAIVER.dynasty; return cheapest.reduce((s, v, i) => s + Math.floor(Math.min(v * w.pct, w.cap + i * w.step)), 0); }
  const w = WAIVER.redraft;
  return cheapest.reduce((s, v) => s + Math.min(Math.round(v * w.pct), w.cap), 0) + Math.max(0, (k - 1) * w.extra);
}
/* Each side's trade value: the plain sum of its assets, plus the waiver adjustment for the side getting fewer pieces. */
function sideTotals(aVals, bVals, dyn) {
  if (dyn == null) dyn = WAIVER_DYNASTY;
  const rawA = aVals.reduce((s, v) => s + (+v || 0), 0), rawB = bVals.reduce((s, v) => s + (+v || 0), 0);
  const adjA = waiverAdj(aVals, bVals, dyn), adjB = waiverAdj(bVals, aVals, dyn);
  return { rawA, rawB, adjA, adjB, ta: rawA + adjA, tb: rawB + adjB };
}
function fairness(a, b, dyn) {
  const s = sideTotals(a.map(p => p.value), b.map(p => p.value), dyn);
  const max = Math.max(s.ta, s.tb, 1);
  return Object.assign(s, { diff: s.tb - s.ta, pct: (s.tb - s.ta) / max });
}

function swapPlayers(players, out, inc) {
  const ids = new Set(out.map(p => p.id));
  return players.filter(p => !ids.has(p.id)).concat(inc.map(p => Object.assign({}, p, { slot: 20 })));
}

function tradeIdeas(m, opts) {

/* ---------- Managers ---------- */
function managerProfiles(m) {

    const age = ages.length ? ages.reduce((a, b) => a + b, 0) / ages.length : null;
    const mine = trades.filter(x => x.items.some(i => i[1] === t.id || i[2] === t.id));

      d: x.d, got: x.items.filter(i => i[2] === t.id).map(i => nameOf(i[0])), sent: x.items.filter(i => i[1] === t.id).map(i => nameOf(i[0]))
    }));

/* ---------- Matchup and playoff odds ---------- */
const SCORE_SD = 22;

  return { players: cur, pts: cur.reduce((s, p) => s + (p.proj || 0), 0) };
}
function matchup(m) {
  const lg = m.lg, me = m.byId.get(lg.myTeamId);
  if (!me || !Array.isArray(lg.sch) || !lg.sch.length) return null;
  const mp = lg.mp || Math.max(...lg.sch.filter(g => g[5]).map(g => g[0]), 0) + 1;
  const g = lg.sch.find(x => x[0] === mp && (x[1] === me.id || x[2] === me.id));
  if (!g) return { mp, bye: true };
  const home = g[1] === me.id, opp = m.byId.get(home ? g[2] : g[1]);
  const a = currentLineupProj(m, me), b = currentLineupProj(m, opp);
  const havePj = me.players.some(p => p.proj != null);
  const live = [home ? g[3] : g[4], home ? g[4] : g[3]];
  const winP = havePj ? normCdf((a.pts - b.pts) / (SCORE_SD * Math.SQRT2)) : null;

function playoffOdds(m, sims) {
  const lg = m.lg;
  if (!Array.isArray(lg.sch) || !lg.sch.length) return null;
  sims = sims || 4000;
  const reg = (lg.sched && lg.sched.reg) || 14, spots = (lg.sched && lg.sched.poTeams) || 4;
  const teams = m.teams;
  const played = {}, base = {};
  teams.forEach(t => { base[t.id] = { w: 0, l: 0, t: 0, pf: 0, g: 0 }; });
  lg.sch.forEach(g => {
    if (g[0] > reg || !g[5]) return;
    const h = base[g[1]], a = base[g[2]];
    if (!h || !a) return;
    h.pf += g[3]; a.pf += g[4]; h.g++; a.g++;
    if (g[5] === 1) { h.w++; a.l++; } else if (g[5] === 2) { a.w++; h.l++; } else { h.t++; a.t++; }
  });
  const remaining = lg.sch.filter(g => g[0] <= reg && !g[5] && base[g[1]] && base[g[2]]);
  /* Team strength: blend points per game so far with lineup projection when available. */
  const mean = {};
  teams.forEach(t => {
    const b = base[t.id];
    const ppg = b.g ? b.pf / b.g : null;
    const pj = currentLineupProj(m, t).pts || null;
    mean[t.id] = ppg && pj ? 0.6 * ppg + 0.4 * pj : ppg || pj || 100;
  });
  const made = {}, seed1 = {}, wins = {};
  teams.forEach(t => { made[t.id] = 0; seed1[t.id] = 0; wins[t.id] = 0; });
  let s = 12345;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const gauss = () => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  for (let i = 0; i < sims; i++) {
    const st = {};
    teams.forEach(t => { const b = base[t.id]; st[t.id] = { w: b.w + b.t * 0.5, pf: b.pf }; });
    remaining.forEach(g => {
      const hs = mean[g[1]] + gauss() * SCORE_SD, as = mean[g[2]] + gauss() * SCORE_SD;
      st[g[1]].pf += hs; st[g[2]].pf += as;
      if (hs > as) st[g[1]].w++; else st[g[2]].w++;
    });
    const order = teams.map(t => t.id).sort((a, b) => st[b].w - st[a].w || st[b].pf - st[a].pf);
    order.slice(0, spots).forEach(id => made[id]++);
    seed1[order[0]]++;
    teams.forEach(t => { wins[t.id] += st[t.id].w; });
  }
  return {
    spots, reg, remaining: remaining.length,
    rows: teams.map(t => ({ t, rec: base[t.id], ppg: base[t.id].g ? base[t.id].pf / base[t.id].g : 0, odds: made[t.id] / sims, top: seed1[t.id] / sims, projW: wins[t.id] / sims, strength: mean[t.id] }))
      .sort((a, b) => b.rec.w - a.rec.w || b.rec.pf - a.rec.pf)

}

    let best = 0, cur = 0, curL = 0, worst = 0;
    gs.forEach(g => { if (g.won) { cur++; curL = 0; } else { curL++; cur = 0; } best = Math.max(best, cur); worst = Math.max(worst, curL); });
    streak[t.id] = { best, worst, now: cur ? 'W' + cur : 'L' + curL };
  });
  const longW = max(m.teams, t => streak[t.id].best), longL = max(m.teams, t => streak[t.id].worst);
  const weekly = {};
  games.forEach(g => { (weekly[g.w] = weekly[g.w] || []).push(g); });
  const topWeeks = {};
  Object.values(weekly).forEach(ws => { const b = max(ws, g => g.pts); topWeeks[b.t] = (topWeeks[b.t] || 0) + 1; });
  const mostTop = Object.entries(topWeeks).sort((a, b) => b[1] - a[1])[0];
  return [
    { k: 'Highest score', v: high.pts.toFixed(1), who: T(high.t), note: 'Week ' + high.w },
    { k: 'Lowest score', v: low.pts.toFixed(1), who: T(low.t), note: 'Week ' + low.w },
    { k: 'Biggest blowout', v: Math.abs(blow[3] - blow[4]).toFixed(1), who: T(blow[3] > blow[4] ? blow[1] : blow[2]), note: 'over ' + (T(blow[3] > blow[4] ? blow[2] : blow[1]) || {}).name + ', week ' + blow[0] },
    { k: 'Closest game', v: Math.abs(close[3] - close[4]).toFixed(1), who: T(close[3] > close[4] ? close[1] : close[2]), note: 'beat ' + (T(close[3] > close[4] ? close[2] : close[1]) || {}).name + ', week ' + close[0] },
    badLoss ? { k: 'Unluckiest loss', v: badLoss.pts.toFixed(1), who: T(badLoss.t), note: 'lost anyway, week ' + badLoss.w } : null,
    luckyWin ? { k: 'Luckiest win', v: luckyWin.pts.toFixed(1), who: T(luckyWin.t), note: 'won anyway, week ' + luckyWin.w } : null,
    { k: 'Longest win streak', v: streak[longW.id].best + ' W', who: longW, note: 'now ' + streak[longW.id].now },
    { k: 'Longest losing streak', v: streak[longL.id].worst + ' L', who: longL, note: 'now ' + streak[longL.id].now },
    mostTop ? { k: 'Most weekly high scores', v: mostTop[1] + '×', who: T(+mostTop[0]), note: 'top score of the week' } : null
  ].filter(Boolean);
}

/* ---------- Dynasty outlook: how strong each team looks now, next year, and three years out ----------
   Now: this season's lineup using redraft values (injuries and news included).
   Later: each player's dynasty value moved along his position's age curve, plus the draft picks a team
   owns turning into rookies (a pick counts for 55% in its first season, 85% in the next, then 100%). */
function outlookLater(p, k) { if (!p.age || !PEAK_AGE[p.pos]) return p.value * Math.pow(0.9, k); return p.value * ageFactor(p.pos, p.age + k) / ageFactor(p.pos, p.age); }
function dynastyOutlook(m) {
  if (m.lg.type !== 'dynasty') return null;
  const season = +m.lg.season || new Date().getFullYear();
  const WIN = [{ k: 0, label: 'Now', year: season }, { k: 1, label: String(season + 1), year: season + 1 }, { k: 3, label: String(season + 3), year: season + 3 }];
  const today = new Date().toISOString().slice(0, 10);
  const newsR = new Map(); ((typeof NEWS !== 'undefined' && NEWS && NEWS.items) || []).filter(x => !x.until || x.until >= today).forEach(x => { if (x.espn) newsR.set(String(x.espn), x.redraft); });
  const nowVal = p => {
    const a = m.vs.alt && ((p.espn && m.vs.alt.byEspn.get(p.espn)) || m.vs.alt.byKey.get(nk(p.name) + '|' + p.pos));
    let v = a ? a.value : p.value * 0.8;
    if (p.inj && INJ_FACTOR[p.inj]) v *= INJ_FACTOR[p.inj];
    const nr = newsR.get(String(p.espn)); if (typeof nr === 'number') v *= nr;
    return v;
  };
  const later = outlookLater;
  const rows = m.teams.map(t => {
    const sk = t.players.filter(p => SKILL.includes(p.pos) || p.pos === 'K' || p.pos === 'D/ST');
    const scores = WIN.map(w => {
      const proj = sk.map(p => Object.assign({}, p, { pv: w.k === 0 ? nowVal(p) : later(p, w.k) }));
      let s = lineup(proj, m.lg.slots, 'pv').value;
      if (w.k > 0) (t.picks || []).forEach(pk => { const yrs = season + w.k - pk.year; if (yrs >= 0) s += 0.5 * pk.value * [0.55, 0.85, 1][Math.min(2, yrs)]; });
      return s;
    });
    const st = lineup(t.players, m.lg.slots).starters.map(x => x.p).filter(p => p && p.age);
    const age = st.length ? st.reduce((a, p) => a + p.age, 0) / st.length : null;
    const sellers = t.players.filter(p => SKILL.includes(p.pos) && p.age && PEAK_AGE[p.pos] && p.age >= PEAK_AGE[p.pos] + (p.pos === 'RB' ? 1 : 2) && p.value >= 1500).sort((a, b) => b.value - a.value).slice(0, 3);
    const young = t.players.filter(p => SKILL.includes(p.pos) && p.age && p.age <= 24 && p.value >= 1500).sort((a, b) => b.value - a.value).slice(0, 3);
    return { team: t, scores, age, picks: (t.picks || []).filter(p => p.round === 1).length, sellers, young };
  });
  const n = rows.length;
  WIN.forEach((w, i) => { rows.slice().sort((a, b) => b.scores[i] - a.scores[i]).forEach((r, j) => { (r.ranks = r.ranks || [])[i] = j + 1; }); });
  const third = Math.ceil(n / 3), half = Math.ceil(n / 2);
  rows.forEach(r => {
    const [now, next, far] = r.ranks;
    const d = now - far;
    r.label = now <= third && far <= half ? 'Dynasty power' : now <= third ? 'Win now' : now > n - third && far <= half ? 'Rebuilding'
      : (far <= third && far < now) || (d >= 3 && far <= half) ? 'Rising' : d <= -3 && far > half ? 'Fading' : now > n - third && far > n - third ? 'Stuck' : 'Middle';
    r.trend = now - far;
  });
  rows.sort((a, b) => a.ranks[0] - b.ranks[0]);
  return { windows: WIN, rows };
}

/* ---------- Game plan: the recommended path for a team, from its outlook ---------- */
function gamePlan(m, o, teamId) {
  const r = o.rows.find(x => x.team.id === teamId);
  if (!r) return null;
  const n = o.rows.length, third = Math.ceil(n / 3), half = Math.ceil(n / 2);
  const t = r.team, [now, next, far] = r.ranks;
  /* direction: push now when this season is the team's best shot and it's near the top; otherwise build for later */
  const dir = r.label === 'Dynasty power' ? 'balanced' : (r.label === 'Win now' || (r.label === 'Fading' && now <= half) || (r.label === 'Middle' && now < far && now <= half)) ? 'contend'
    : (r.label === 'Rebuilding' || r.label === 'Stuck' || r.label === 'Rising' || r.label === 'Fading' || far < now) ? 'rebuild' : 'contend';
  const HEAD = {
    balanced: ['Stay the course', 'You\u2019re strong now and later. Don\u2019t sell the future for a small upgrade; turn extra depth into one better starter.'],
    contend: ['Go for it this season', now <= third ? 'You\u2019re a top team now. Use picks and young depth to upgrade your weakest starters while your window is open.' : 'You\u2019re close. One or two upgrades at your weak spots could make you a real contender; pay with picks and young bench players.'],
    rebuild: ['Build for ' + o.windows[2].year, far <= half ? 'Your best years are ahead. Sell veterans who will lose value, and add picks and players 24 and under.' : 'You\u2019re not winning now or later with this roster. Sell anyone past his prime while he still has value and stock up on picks and young players.']
  };
  const others = o.rows.filter(x => x.team.id !== t.id);
  const isBuyer = x => ['Win now', 'Fading', 'Dynasty power', 'Middle'].includes(x.label) && x.ranks[0] <= half + 1;
  const isSeller = x => ['Rebuilding', 'Stuck', 'Rising'].includes(x.label) || x.ranks[2] < x.ranks[0] - 2;
  const loss = p => p.value ? 1 - outlookLater(p, 3) / p.value : 0;
  const skill = t.players.filter(p => SKILL.includes(p.pos) && p.value >= 300);
  /* sell: players whose value drops most by year 3 (rebuild), or surplus/aging bench pieces (contend) */
  const startersIds = new Set(lineup(t.players, m.lg.slots).starters.map(x => x.p && x.p.id).filter(Boolean));
  let sell = dir === 'rebuild' ? skill.filter(p => loss(p) >= 0.2 && (!p.age || p.age > 24)).sort((a, b) => b.value * loss(b) - a.value * loss(a)).slice(0, 5)
    : skill.filter(p => !startersIds.has(p.id) && (t.surplus.includes(p.pos) || (p.age && p.age <= 24 && dir === 'contend'))).sort((a, b) => b.value - a.value).slice(0, 4);
  const buyersFor = p => others.filter(x => (dir === 'rebuild' ? isBuyer(x) : true) && x.team.needs.includes(p.pos)).slice(0, 3).map(x => x.team);
  /* buy: proven starters at your needs from sellers (contend), or young players / picks from buyers (rebuild) */
  let buy = [];
  if (dir === 'rebuild') {
    others.filter(isBuyer).forEach(x => x.team.players.filter(p => SKILL.includes(p.pos) && p.age && p.age <= 24 && p.value >= 1200).forEach(p => buy.push({ p, from: x.team })));
    buy.sort((a, b) => b.p.value - a.p.value); buy = buy.slice(0, 5);
  } else {
    const needs = t.needs.length ? t.needs : SKILL.filter(p => t.rank[p] > third);
    others.filter(isSeller).forEach(x => x.team.players.filter(p => needs.includes(p.pos) && p.value >= 1500 && (!p.age || p.age >= 25)).forEach(p => buy.push({ p, from: x.team })));
    buy.sort((a, b) => b.p.value - a.p.value); buy = buy.slice(0, 5);
  }
  const picks = (t.picks || []).slice().sort((a, b) => a.year - b.year || a.round - b.round);
  const pickAdvice = dir === 'rebuild' ? 'Keep your picks' + (picks.length ? ' (' + picks.filter(p => p.round === 1).length + ' firsts)' : '') + ' and ask for more in every veteran trade.'
    : dir === 'contend' ? (picks.length ? 'Your picks are trade chips. Later-year picks cost you the least today.' : 'You\u2019re out of picks to deal; use young bench players instead.')
    : 'Hold your firsts unless they bring back a clear upgrade.';
  const steps = [];
  if (sell.length) steps.push(dir === 'rebuild' ? 'Sell ' + sell.slice(0, 2).map(p => p.name).join(' and ') + ' before age drops their value.' : 'Package ' + sell.slice(0, 2).map(p => p.name).join(' and ') + ' (bench depth) for one better starter.');
  if (buy.length) steps.push(dir === 'rebuild' ? 'Target young players like ' + buy[0].p.name + ' from ' + (buy[0].from.abbrev || buy[0].from.name) + ', a team trying to win now.' : 'Target ' + buy[0].p.name + ' from ' + (buy[0].from.abbrev || buy[0].from.name) + ', a team looking to the future.');
  if (t.needs.length && dir !== 'rebuild') steps.push('Your weakest spot' + (t.needs.length > 1 ? 's are ' : ' is ') + t.needs.join(' and ') + '. Upgrade there first.');
  steps.push(pickAdvice);
  return { r, dir, head: HEAD[dir][0], why: HEAD[dir][1], steps, sell: sell.map(p => ({ p, loss: loss(p), buyers: buyersFor(p) })), buy, picks };
}

function valueChart(m, t) {
  const h = (m.lg.history || []).filter(s => s.t && s.t[t.id]);
  if (h.length < 2) return '<section class="card mt"><h3>Value over time</h3><p class="muted small">The app saves your roster’s value every time you sync. After your next sync you’ll see a chart here, and it fills in week by week.</p></section>';
  const W = 640, H = 200, P = 34;
  const tot = h.map(s => s.t[t.id][1]), st = h.map(s => s.t[t.id][0]);
  const lo = Math.min(...st) * 0.95, hi = Math.max(...tot) * 1.03;
  const x = i => P + (W - P * 2) * (h.length === 1 ? 0.5 : i / (h.length - 1)), y = v => H - 24 - (H - 48) * (v - lo) / (hi - lo || 1);
  const line = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const rankNow = m.teams.slice().sort((a, b) => b.totalValue - a.totalValue).findIndex(z => z.id === t.id) + 1;
  const first = h[0].t, firstRank = Object.entries(first).sort((a, b) => b[1][1] - a[1][1]).findIndex(e => +e[0] === t.id) + 1;
  const d = tot[tot.length - 1] - tot[0];
  return '<section class="card mt"><h3>Value over time</h3><p class="small">Roster value is <b class="' + (d >= 0 ? 'pos-d' : 'neg-d') + '">' + (d >= 0 ? 'up ' : 'down ') + fmt(Math.abs(d)) + '</b> since ' + when(h[0].d) + '. League rank: ' + ord(firstRank) + ' → <b>' + ord(rankNow) + '</b>.</p>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Roster value over time">' +
    [0, 0.5, 1].map(k => { const v = lo + (hi - lo) * k; return '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/><text x="' + (P - 6) + '" y="' + (y(v) + 4) + '" class="axis" text-anchor="end">' + Math.round(v / 1000) + 'k</text>'; }).join('') +
    '<path d="' + line(tot) + ' L' + x(h.length - 1) + ' ' + (H - 24) + ' L' + x(0) + ' ' + (H - 24) + ' Z" class="area"/>' +
    '<path d="' + line(tot) + '" class="l1"/><path d="' + line(st) + '" class="l2"/>' +
    '<circle cx="' + x(h.length - 1) + '" cy="' + y(tot[tot.length - 1]) + '" r="4.5" class="dot1"/><circle cx="' + x(h.length - 1) + '" cy="' + y(st[st.length - 1]) + '" r="4" class="dot2"/>' +
    '<text x="' + x(0) + '" y="' + (H - 6) + '" class="axis">' + when(h[0].d) + '</text><text x="' + x(h.length - 1) + '" y="' + (H - 6) + '" class="axis" text-anchor="end">' + when(h[h.length - 1].d) + '</text></svg>' +
    '<div class="row small"><span><i class="key k1"></i>Whole roster</span><span><i class="key k2"></i>Starters</span></div></section>';
}

/* Snapshots: history for the chart and the previous rosters for the rival tracker. */
function recordHistory(lg) {
  const m = modelFor(lg);
  if (!m) return;
  lg.history = (lg.history || []).filter(s => s && s.t);
  const snap = snapshot(m), last = lg.history[lg.history.length - 1];
  if (last && Math.abs(last.d - snap.d) < 3 * 3600e3) lg.history[lg.history.length - 1] = snap; else lg.history.push(snap);
  if (lg.history.length > 80) lg.history = lg.history.slice(-80);
}

/* ---------- Search any player ---------- */
function globalPlayer(m, id) {
  if (!ALLPLAYERS || !ALLPLAYERS.players) return null;
  const pid = String(id).replace(/^e/, '');
  const row = ALLPLAYERS.players.find(x => String(x[0]) === pid);
  if (!row) return null;
  const [espn, name, posId, pro, owned] = row;
  const pos = POS[posId] || '?';
  const fc = m.vs.byEspn.get(String(espn)) || m.vs.byKey.get(nk(name) + '|' + pos);
  const p = { id: 'e' + espn, espn: String(espn), name, pos, team: (fc && fc.team) || PRO[pro] || 'FA', proTeam: pro, slot: 20, inj: '', value: fc ? fc.value : 0, fcValue: fc ? fc.value : 0, age: fc ? fc.age : null, trend: fc ? fc.trend : 0, owner: null, owned, est: fc ? '' : null };
  if (!fc) { p.est = 'floor'; p.estWhy = 'Not valued by FantasyCalc; deep depth player.'; p.value = pos === 'K' || pos === 'D/ST' ? Math.round(30 + 1.5 * (owned || 0)) : Math.round(10 + (owned || 0) * 4); }
  applyNews([p], NEWS, m.lg.type === 'dynasty' ? 'dynasty' : 'redraft');
  return p;
}
function searchPool(m) {
  const seen = new Set(), out = [];
  const add = p => { if (p && !seen.has(p.id)) { seen.add(p.id); out.push(p); } };
  m.teams.forEach(t => t.players.forEach(add));
  (m.freeAgents || []).forEach(add);
  return { out, seen };
}
function openSearch() {
  const d = $('#modal');
  d.innerHTML = '<div class="modal-card sheet wide search-sheet" role="dialog" aria-modal="true" aria-label="Search players"><div class="row" style="margin:0"><input id="gq" type="search" autocomplete="off" placeholder="Search any NFL player or 2027 prospect" style="flex:1"><button class="x" id="pClose" aria-label="Close">×</button></div><div id="gres" class="gres"></div></div>';

  try {
    const [a, st, gl] = await Promise.all([fetch(base).then(r => r.json()), fetch(base + '/stats').then(r => r.json()).catch(() => ({})), fetch(base + '/gamelog').then(r => r.json()).catch(() => ({}))]);
    const at = a.athlete || a;
    const bio = [at.age ? 'Age ' + at.age : '', at.displayHeight && at.displayWeight ? at.displayHeight + ', ' + at.displayWeight : '', at.displayExperience || '', at.college && at.college.name ? at.college.name : '', at.displayDraft || ''].filter(Boolean).join(' · ');
    const cur = c => { const rows = (c.statistics || []); const last = rows[rows.length - 1]; return last && last.season ? { y: last.season.year, v: Object.fromEntries((c.labels || []).map((l, i) => [l, last.stats[i]])) } : null; };

    if (cats.receiving && +String(cats.receiving.v.REC || 0).replace(/,/g, '') > 0) parts.push(cats.receiving.v.REC + ' rec (' + (cats.receiving.v.TGTS || '?') + ' tgt), ' + cats.receiving.v.YDS + ' yds, ' + cats.receiving.v.TD + ' TD');

    let games = '';
    const reg = (gl.seasonTypes || []).find(s => /Regular/.test(s.displayName)) || (gl.seasonTypes || [])[0];
    const evs = reg && reg.categories && reg.categories[0] ? reg.categories[0].events || [] : [];
    if (evs.length) {
      const labels = gl.labels || [], names = gl.names || [];
      const pick = (row, name) => { const i = names.indexOf(name); return i >= 0 ? row.stats[i] : null; };
      const line = row => {

        if (pyd != null && +pyd) bits.push(pyd + ' pass yds' + (+ptd ? ', ' + ptd + ' TD' : ''));
        if (car != null && +car) bits.push(car + '-' + ryd + (+rtd ? ', ' + rtd + ' TD' : ''));
        if (rec != null && +rec) bits.push(rec + ' rec ' + cyd + ' yds' + (+ctd ? ', ' + ctd + ' TD' : ''));
        return bits.join(' · ') || labels.slice(0, 3).map((l, i) => l + ' ' + row.stats[i]).join(' · ');
      };
      games = '<h3 class="mt">Last ' + Math.min(5, evs.length) + ' games</h3><table class="roster"><tbody>' + evs.slice(0, 5).map(row => { const e = (gl.events || {})[row.eventId] || {}; return '<tr><td class="slot">Wk ' + (e.week || '') + '</td><td class="small">' + esc((e.atVs || '') + ' ' + ((e.opponent || {}).abbreviation || '')) + ' <span class="' + (e.gameResult === 'W' ? 'pos-d' : 'neg-d') + '">' + esc((e.gameResult || '') + ' ' + (e.score || '')) + '</span></td><td class="small">' + esc(line(row)) + '</td></tr>'; }).join('') + '</tbody></table>';
    }
    el.innerHTML = (bio ? '<p class="small muted">' + esc(bio) + '</p>' : '') + (parts.length ? '<h3 class="mt">' + (season || '') + ' season' + (gp.GP ? ' · ' + gp.GP + ' games' : '') + '</h3><p class="small">' + parts.map(esc).join('<br>') + '</p>' : '') + games + '<p class="small muted">Live from ESPN.</p>';
  } catch (e) { el.innerHTML = '<p class="muted small">Couldn’t load ESPN stats right now.</p>'; }

/* ======================= 1. Share a trade ======================= */
const APP_URL = 'https://hhbooth13.github.io/Trade-desk/';
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
function shareTrade() {
  const m = model(), c = ui.calc;
  const A = c.a.map(id => asset(m, id)).filter(Boolean), B = c.b.map(id => asset(m, id)).filter(Boolean);
  if (!A.length || !B.length) return;
  const f = fairness(A, B);
  const tA = m.byId.get(+c.aTeam), tB = m.byId.get(+c.bTeam);
  const payload = { v: 1, l: m.lg.demo ? null : String(m.lg.id), a: c.a, b: c.b, ta: tA ? tA.id : null, tb: tB ? tB.id : null };
  const url = APP_URL + '#calc?t=' + b64u(JSON.stringify(payload));
  const nm = (t, d) => t ? t.name : d;
  const text = nm(tA, 'Side A') + ' gives ' + A.map(p => p.name).join(' + ') + '\n' + nm(tB, 'Side B') + ' gives ' + B.map(p => p.name).join(' + ') +
    '\nTrade Desk value: ' + fmt(f.ta) + ' vs ' + fmt(f.tb) + (f.adjA || f.adjB ? ' (incl. waiver adjustment)' : '') + '\n';
  const d = $('#modal');
  d.innerHTML = '<div class="modal-card sheet" role="dialog" aria-modal="true" aria-labelledby="shh"><div class="sheet-head"><div><h3 id="shh">Share this trade</h3><div class="small muted">Anyone with the app opens the same trade, valued for their league.</div></div><button class="x sheet-x" id="pClose" aria-label="Close">×</button></div>' +
    '<pre class="share-text">' + esc(text) + '</pre><input id="shUrl" type="text" readonly value="' + esc(url) + '" style="width:100%">' +
    '<div class="row"><button class="btn" id="shGo">' + (navigator.share ? 'Share…' : 'Copy link') + '</button>' + (navigator.share ? '<button class="btn ghost" id="shCopy">Copy link</button>' : '') + '<span class="small muted" id="shMsg"></span></div></div>';
  d.hidden = false;
  const close = () => { d.hidden = true; };
  $('#pClose').onclick = close; d.onclick = e => { if (e.target === d) close(); };
  const copy = async () => {
    try { await navigator.clipboard.writeText(text + url); $('#shMsg').textContent = 'Copied. Paste it in your group chat.'; }
    catch (e) { const i = $('#shUrl'); i.focus(); i.select(); $('#shMsg').textContent = 'Press copy on the highlighted link.'; }
  };
  $('#shGo').onclick = async () => { if (navigator.share) { try { await navigator.share({ title: 'Trade idea', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } } copy(); };
  if ($('#shCopy')) $('#shCopy').onclick = copy;
}
/* Opening a shared link: #calc?t=... loads the trade into the calculator. */
function openSharedTrade(code) {
  let p; try { p = JSON.parse(unb64u(code)); } catch (e) { return false; }
  if (!p || !Array.isArray(p.a) || !Array.isArray(p.b)) return false;
  if (p.l && S.leagues[p.l]) S.active = p.l;
  const m = model();
  const ok = id => !!asset(m, id);
  const a = p.a.filter(ok), b = p.b.filter(ok);
  ui.calc = { a, b, aTeam: m.byId.get(p.ta) ? p.ta : null, bTeam: m.byId.get(p.tb) ? p.tb : null };
  ui.sharedNote = (a.length < p.a.length || b.length < p.b.length) ? 'Some of the shared players or picks aren’t in your current league, so they were left out.' + (p.l && !S.leagues[p.l] ? ' Sync that league to see the whole trade.' : '') : 'Shared trade loaded.';
  return true;
}

/* ======================= 2. What changed ======================= */
function seenSnapshot(m) {
  const vals = {};
  m.teams.forEach(t => t.players.concat(t.picks || []).forEach(p => { vals[p.id] = p.value; }));
  const me = m.byId.get(m.lg.myTeamId);
  const blockKeys = []; (blockOf(m.lg).sell || []).forEach(id => { const p = m.players.get(id); if (p) m.teams.forEach(t => { if (me && t.id !== me.id && t.needs.includes(p.pos)) blockKeys.push(id + ':' + t.id); }); });
  return { t: Date.now(), block: blockKeys, vals, trades: tradeGrades(m).map(g => g.rows.map(r => r.got.map(p => p.id).join('+')).join('|')), rank: me ? me.rank.starter : null, total: me ? me.totalValue : null };
}
function changesCard(m) {
  const lg = S.leagues[m.lg.id] || m.lg;
  const me = m.byId.get(m.lg.myTeamId);
  if (!me || m.lg.demo) return '';
  if (!lg.seen) { lg.seen = seenSnapshot(m); save([lg.id]); }
  const seen = lg.seen, since = seen.t;
  const items = [];
  /* my players' value moves */
  const moves = me.players.concat(me.picks || []).map(p => ({ p, d: seen.vals[p.id] != null ? p.value - seen.vals[p.id] : null })).filter(x => x.d != null && Math.abs(x.d) >= Math.max(120, 0.05 * (seen.vals[x.p.id] || 1)));
  moves.sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 5).forEach(x => items.push({ k: x.d > 0 ? 'up' : 'down', html: '<b>' + esc(x.p.name) + '</b> ' + (x.d > 0 ? 'rose' : 'fell') + ' <b class="' + (x.d > 0 ? 'pos-d' : 'neg-d') + '">' + (x.d > 0 ? '+' : '−') + fmt(Math.abs(x.d)) + '</b> to ' + fmt(x.p.value), id: x.p.id }));
  /* news on rostered players */
  const owners = new Map(); m.teams.forEach(t => t.players.forEach(p => owners.set(String(p.espn), t)));
  ((NEWS && NEWS.items) || []).filter(n => n.date && new Date(n.date + 'T23:59:59').getTime() >= since - 864e5).forEach(n => {
    const t = owners.get(String(n.espn)); if (!t) return;
    items.push({ k: 'news', html: '<b>' + esc(n.name) + '</b> <span class="muted">(' + (t.id === me.id ? 'yours' : esc(t.abbrev || t.name)) + ')</span>: ' + esc(n.note), mine: t.id === me.id });
  });
  /* new trades in the league */
  const seenTr = new Set(seen.trades || []);
  tradeGrades(m).filter(g => !seenTr.has(g.rows.map(r => r.got.map(p => p.id).join('+')).join('|'))).slice(0, 4).forEach(g => {
    items.push({ k: 'trade', html: 'New trade: ' + g.rows.map(r => '<b>' + esc(r.team ? r.team.abbrev || r.team.name : '?') + '</b> got ' + r.got.map(p => esc(p.name)).join(' + ')).join('; ') });
  });
  /* rank move */
  if (seen.rank && me.rank.starter !== seen.rank) items.push({ k: me.rank.starter < seen.rank ? 'up' : 'down', html: 'Your starting lineup moved from <b>' + ord(seen.rank) + '</b> to <b>' + ord(me.rank.starter) + '</b> in the league.' });
  /* trade block matches */
  const sell = (blockOf(lg).sell || []).map(id => m.players.get(id)).filter(Boolean);
  sell.forEach(p => {
    const seenB = new Set(seen.block || []);
    const fits = m.teams.filter(t => t.id !== me.id && t.needs.includes(p.pos) && !seenB.has(p.id + ':' + t.id));
    if (fits.length) items.push({ k: 'block', html: '<b>' + esc(p.name) + '</b> is on your block and ' + fits.length + ' team' + (fits.length > 1 ? 's need' : ' needs') + ' a ' + p.pos + ': ' + fits.slice(0, 4).map(t => esc(t.abbrev || t.name)).join(', ') });
  });
  /* first visit or quiet: show the month's biggest movers on your roster instead */
  let body;
  if (!items.length) {
    const tr = me.players.filter(p => p.trend).sort((a, b) => Math.abs(b.trend) - Math.abs(a.trend)).slice(0, 3);
    body = '<p class="small muted" style="margin:0 0 6px">Nothing new since you last checked.' + (tr.length ? ' Biggest 30-day moves on your roster:' : '') + '</p>' + tr.map(p => '<div class="chg ' + (p.trend > 0 ? 'up' : 'down') + '"><b>' + esc(p.name) + '</b> <span class="' + (p.trend > 0 ? 'pos-d' : 'neg-d') + '">' + (p.trend > 0 ? '+' : '−') + fmt(Math.abs(p.trend)) + '</span> this month</div>').join('');
  } else {
    const icon = { up: '▲', down: '▼', news: '!', trade: '⇄', block: '★' };
    body = items.slice(0, 10).map(x => '<div class="chg ' + x.k + '"' + (x.id ? ' data-act="player" data-id="' + esc(x.id) + '"' : '') + '><i>' + icon[x.k] + '</i><span>' + x.html + '</span></div>').join('');
  }
  return '<section class="card changes"><div class="row" style="justify-content:space-between;margin:0 0 8px"><h3 style="margin:0">What changed' + (items.length ? ' <span class="cnt">' + items.length + '</span>' : '') + '</h3>' +
    '<span class="small muted">' + (items.length ? 'since your last check, ' + ago(since) : 'checked ' + ago(since)) + (items.length ? ' · <button class="link small" data-act="seenAll">Mark all seen</button>' : '') + '</span></div>' + body + '</section>';
}

/* ======================= 3. Live rookie draft ======================= */
function liveDraftCard(m) {
  const lg = S.leagues[m.lg.id] || m.lg;
  const year = m.picks.length ? m.picks[0].year : null;
  if (!year) return '<section class="card"><p>Set a league to Dynasty on the Sync tab to run draft day.</p></section>';
  const picks = m.picks.filter(p => p.year === year).sort((a, b) => a.round - b.round || a.pickNo - b.pickNo);
  const st = lg.liveDraft && lg.liveDraft.year === year ? lg.liveDraft : (lg.liveDraft = { year, made: [] });
  const made = st.made, i = made.length;
  const taken = new Set(made.map(x => x.name));
  const consensus = ROOKIES.filter(r => !taken.has(r[0]));
  const myOrder = (ui.board === 'mine' ? rookieOrder() : ROOKIES).filter(r => !taken.has(r[0]));
  const lbl = pk => pk.round + '.' + String(pk.pickNo).padStart(2, '0');
  const tn = t => t ? esc(t.abbrev || t.name) : '?';
  const log = made.map((x, k) => { const pk = picks[k], t = pk && m.byId.get(pk.owner); return '<div class="ld-row' + (pk && pk.owner === m.lg.myTeamId ? ' me' : '') + '"><span class="pk">' + (pk ? lbl(pk) : '') + '</span>' + (t ? fteamAvatar(t, 'xs') : '') + '<span class="ld-t">' + tn(t) + '</span>' + (x.pos ? posChip(x.pos) : '') + '<b>' + esc(x.name) + '</b></div>'; }).reverse().join('');
  const controls = '<div class="row">' + (made.length ? '<button class="btn ghost sm" data-act="ldUndo">Undo last pick</button><button class="btn ghost danger sm" data-act="ldReset">Start over</button>' : '') + '</div>';
  if (i >= picks.length) {
    const mineHaul = made.filter((x, k) => picks[k].owner === m.lg.myTeamId);
    return '<section class="card ld"><h3>Draft complete</h3><p>Your picks: ' + (mineHaul.map(x => '<b>' + esc(x.name) + '</b>').join(', ') || 'none') + '</p>' + controls + '<div class="ld-log">' + log + '</div></section>';
  }
  const pk = picks[i], t = m.byId.get(pk.owner), isMe = pk.owner === m.lg.myTeamId;
  const myNext = picks.findIndex((p, k) => k >= i && p.owner === m.lg.myTeamId);
  const one = m.lg.qbs !== 2;
  const pool = isMe ? myOrder : consensus;
  const rank = new Map(pool.map((r, k) => [r[0], k]));
  const scored = pool.slice(0, 40).map(r => {
    let v = 1000 * Math.exp(-rank.get(r[0]) / 16);
    if (!isMe && t && t.needs.includes(r[1])) v += 45;
    if (isMe && t && t.needs.includes(r[1])) v += 25;
    if (one && r[1] === 'QB' && !(t && t.needs.includes('QB'))) v *= 0.85;
    return { r, v };
  }).sort((a, b) => b.v - a.v);
  const why = r => { const bits = []; const cr = ROOKIES.indexOf(r) + 1; bits.push('#' + cr + ' overall'); if (t && t.needs.includes(r[1])) bits.push('fills a ' + r[1] + ' need'); const br = boardRanks(r[0]); if (br.dyn) bits.push('boards avg #' + br.dyn.avg.toFixed(1)); return bits.join(' · '); };
  const best = scored.slice(0, 4).map((x, k) => '<div class="ld-pick' + (k === 0 ? ' top' : '') + '"><div class="ld-pm">' + posChip(x.r[1]) + '<b class="link" data-act="prospect" data-name="' + esc(x.r[0]) + '">' + esc(x.r[0]) + '</b><div class="small muted">' + esc(x.r[2]) + ' · ' + why(x.r) + '</div></div><button class="btn sm" data-act="ldPick" data-name="' + esc(x.r[0]) + '">Draft</button></div>').join('');
  const f = ui.ldPos || '';
  const rest = consensus.filter(r => !f || r[1] === f).map(r => '<div class="ld-av">' + '<span class="num muted">' + (ROOKIES.indexOf(r) + 1) + '</span>' + posChip(r[1]) + '<b class="link" data-act="prospect" data-name="' + esc(r[0]) + '">' + esc(r[0]) + '</b><span class="small muted">' + esc(r[2]) + '</span><button class="btn ghost sm" data-act="ldPick" data-name="' + esc(r[0]) + '">Draft</button></div>').join('');
  return '<section class="card ld' + (isMe ? ' mine' : '') + '"><div class="ld-clock"><span class="ld-lbl">' + (isMe ? 'You’re on the clock' : 'On the clock') + '</span><div class="ld-team">' + fteamAvatar(t, 'lg') + '<div><div class="ld-pkno">Pick ' + lbl(pk) + ' <span class="muted small">(' + (i + 1) + ' of ' + picks.length + ')</span></div><h2>' + (t ? esc(t.name) : '?') + '</h2>' +
    (t && t.needs.length ? '<div class="small muted">Needs ' + t.needs.join(', ') + '</div>' : '') + '</div></div>' +
    (!isMe ? '<div class="small">' + (myNext >= 0 ? 'Your next pick: <b>' + lbl(picks[myNext]) + '</b>, ' + (myNext - i === 1 ? 'right after this one' : (myNext - i) + ' picks away') : 'You have no picks left in this draft.') + '</div>' : '') + '</div>' +
    '<h3 class="mt">' + (isMe ? 'Best for you' + (ui.board === 'mine' ? ' (your board)' : '') : 'Most likely picks') + '</h3>' + best +
    '<div class="row mt" style="gap:6px"><input id="ldOther" type="text" placeholder="Picked someone not listed? Type the name" style="flex:1;min-width:160px"><button class="btn ghost sm" data-act="ldOther">Add</button></div>' +
    controls + '</section>' +
    '<section class="card mt"><div class="row" style="justify-content:space-between;margin:0 0 6px"><h3 style="margin:0">Best available</h3><div class="ctrl">' + ['', 'QB', 'RB', 'WR', 'TE'].map(p => '<button class="chip sm' + (f === p ? ' on' : '') + '" data-act="ldPos" data-pos="' + p + '">' + (p || 'All') + '</button>').join('') + '</div></div><div class="ld-list">' + (rest || '<p class="muted small">Nobody left at that position.</p>') + '</div></section>' +
    (log ? '<section class="card mt"><h3>Picks so far</h3><div class="ld-log">' + log + '</div></section>' : '');
}
