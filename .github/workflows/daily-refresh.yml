name: Daily data refresh

on:
  schedule:
    - cron: '17 10 * * *'   # 5:17 AM Eastern (6:17 AM during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull FantasyCalc values and prospect stats
        run: python3 scripts/refresh.py
      - name: Rebuild the app
        run: python3 src/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src index.html
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
